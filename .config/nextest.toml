# cargo-nextest configuration
# https://nexte.st/book/configuration.html

[store]
# Use a directory inside target to store test artifacts
dir = "target/nextest"

# Default profile
[profile.default]
# Run tests in parallel using all available cores
test-threads = "num-cpus"
# Fail fast - stop on first failure
fail-fast = true
# Status level to show
status-level = "pass"
# Final status level
final-status-level = "fail"
# Retry failed tests once
retries = 1

# CI profile - optimized for GitHub Actions
[profile.ci]
# Use all available cores
test-threads = "num-cpus"
# Don't fail fast in CI - run all tests to see full picture
fail-fast = false
# Show all test results
status-level = "all"
final-status-level = "all"
# No retries in CI - we want deterministic results
retries = 0
# Longer timeout for CI (some tests may be slow on shared runners)
slow-timeout = { period = "60s", terminate-after = 3 }

# CI profile with JUnit output for test reporting
[profile.ci-junit]
test-threads = "num-cpus"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }

# Generate JUnit XML for CI systems
[profile.ci-junit.junit]
path = "target/nextest/junit.xml"
report-name = "omg-tests"

# Development profile - fast feedback loop
[profile.dev]
# Fewer threads for development to leave CPU for other tasks
test-threads = 4
fail-fast = true
status-level = "pass"
retries = 0

# Heavy tests profile - for resource-intensive tests
[profile.heavy]
test-threads = 2
fail-fast = false
retries = 1
slow-timeout = { period = "120s", terminate-after = 2 }
