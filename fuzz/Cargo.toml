[package]
name = "omg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
bitcode = { version = "0.6", features = ["serde"] }
libfuzzer-sys = "0.4"
toml = "1.0.3"
omg_lib = { package = "omg", path = "..", default-features = false }

[[bin]]
name = "parse_config"
path = "fuzz_targets/parse_config.rs"
test = false
doc = false

[[bin]]
name = "ipc_messages"
path = "fuzz_targets/ipc_messages.rs"
test = false
doc = false

[[bin]]
name = "package_names"
path = "fuzz_targets/package_names.rs"
test = false
doc = false
