# Local multi-distro test harness: one command to exercise omg against all
# three major Linux package-manager families, mirroring the ci.yml matrix.
#
# Usage:
#   docker compose build                 # build all three
#   docker compose run --build arch      # Arch (pacman/ALPM) smoke
#   docker compose run --build debian    # Debian (apt/rust-apt) smoke
#   docker compose run --build fedora    # Fedora (dnf/rpm sqlite) smoke
#
# The Debian service runs the binary built in Dockerfile.apt. The deeper
# Debian smoke image is built separately by scripts/debian-smoke-test.sh.

services:
  arch:
    build:
      context: .
      dockerfile: Dockerfile.arch-e2e
    command: >
      bash -c "/usr/local/bin/omg --version &&
               /usr/local/bin/omg status --fast &&
               /usr/local/bin/omg search shell | head -5"

  debian:
    build:
      context: .
      dockerfile: Dockerfile.apt
    command: >
      bash -c "/usr/local/bin/omg --version &&
               /usr/local/bin/omg status --fast &&
               /usr/local/bin/omg search bash | head -5"

  fedora:
    build:
      context: .
      dockerfile: Dockerfile.fedora
