# OMG Configuration Example
# Default location: ~/.config/omg/config.toml
#
# This file demonstrates all available configuration options with explanations.
# Uncomment and modify values as needed for your setup.

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Enable shims for runtime version switching (default: false)
# - false: Uses PATH modification (faster, recommended)
# - true: Uses shim binaries (slower, but compatible with more shells)
#shims_enabled = false

# OMG data directory (default: ~/.local/share/omg)
# Stores: installed runtimes, package cache, databases
#data_dir = "/home/user/.local/share/omg"

# Daemon socket path (default: XDG_RUNTIME_DIR or /tmp)
# Used for CLI-to-daemon communication
#socket_path = "/tmp/omgd.sock"

# Default shell for hooks (default: "zsh")
# Options: "bash", "zsh", "fish", "powershell"
#default_shell = "zsh"

# Auto-update runtime versions on install (default: false)
# When true, automatically updates to latest patch version
#auto_update = false

# Enable telemetry (default: true)
# Helps improve OMG by sending anonymous usage data
# Set to false to disable (can also use OMG_NO_TELEMETRY=1 env var)
#telemetry_enabled = true

# Runtime resolution backend (default: "native-then-mise")
# Options:
# - "native": Use OMG's built-in runtime management only
# - "mise": Use mise (bundled) for all runtimes
# - "native-then-mise": Try OMG native first, fall back to mise
#runtime_backend = "native-then-mise"

# ============================================================================
# AUR BUILD SETTINGS (Arch Linux only)
# ============================================================================

[aur]

# Build method for AUR packages (default: "native")
# Options:
# - "bubblewrap": Sandboxed builds using bubblewrap (most secure)
# - "chroot": Builds in a clean chroot (secure, slower)
# - "native": Direct builds (fast, less secure)
#build_method = "native"

# Maximum concurrent AUR builds (default: number of CPU cores)
# Adjust based on available RAM (each build can use 1-2GB)
#build_concurrency = 8

# Require interactive PKGBUILD review before building (default: false)
# When true, prompts to review PKGBUILD content before build
#review_pkgbuild = false

# Use stricter makepkg flags (default: true)
# Enables: --cleanbuild, --verifysource
#secure_makepkg = true

# Allow native builds without sandboxing (default: true)
# Set to false to enforce bubblewrap/chroot only
#allow_unsafe_builds = true

# Use AUR metadata archive for bulk update checks (default: true)
# Speeds up checking for updates across many packages
#use_metadata_archive = true

# Metadata archive cache TTL in seconds (default: 300 = 5 minutes)
#metadata_cache_ttl_secs = 300

# Custom MAKEFLAGS (overrides auto -jN)
# Example: "-j4" to limit parallel make jobs
#makeflags = "-j8"

# Custom PKGDEST (shared package cache)
# Where built packages (.pkg.tar.zst) are stored
#pkgdest = "/var/cache/omg/packages"

# Custom SRCDEST (shared source cache)
# Where source tarballs are cached
#srcdest = "/var/cache/omg/sources"

# Enable build cache re-use based on PKGBUILD hash (default: true)
# Skips rebuilding if PKGBUILD hasn't changed
#cache_builds = true

# Enable ccache integration (default: false)
# Speeds up C/C++ compilation by caching object files
#enable_ccache = false

# Optional ccache directory
# If not set, uses ccache default (~/.ccache)
#ccache_dir = "/home/user/.cache/ccache"

# Enable sccache integration (default: false)
# Alternative to ccache, supports Rust compilation caching
#enable_sccache = false

# Optional sccache directory
# If not set, uses sccache default (~/.cache/sccache)
#sccache_dir = "/home/user/.cache/sccache"

# ============================================================================
# EXAMPLE CONFIGURATIONS
# ============================================================================

# --- Performance-Optimized Setup ---
# Uncomment for maximum build speed:
#
# [aur]
# build_method = "native"
# build_concurrency = 16
# cache_builds = true
# enable_ccache = true
# enable_sccache = true
# secure_makepkg = false
# allow_unsafe_builds = true

# --- Security-Hardened Setup ---
# Uncomment for maximum security:
#
# [aur]
# build_method = "bubblewrap"
# build_concurrency = 4
# review_pkgbuild = true
# secure_makepkg = true
# allow_unsafe_builds = false
# cache_builds = false

# --- Team/CI Setup ---
# Uncomment for reproducible team environments:
#
# data_dir = "/opt/omg"
# auto_update = false
# telemetry_enabled = false
# [aur]
# build_method = "chroot"
# pkgdest = "/opt/omg/packages"
# srcdest = "/opt/omg/sources"
# cache_builds = true
