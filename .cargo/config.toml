[build]
jobs = 2
rustflags = []

# CPU-Specific Optimization (5-10% improvement on native hardware)
# Uncomment to enable AVX2, BMI2, and other CPU-specific instructions:
# rustflags = ["-C", "target-cpu=native"]
# WARNING: Binary will ONLY work on CPUs with same features as build machine

# Use gcc linker (conservative, compatible with LTO)
# Alternatives: mold (10x faster), lld (5x faster)
# Note: rustls + rust-lld + LTO can cause .eh_frame corruption on Debian/Ubuntu
[target.x86_64-unknown-linux-gnu]
linker = "gcc"
