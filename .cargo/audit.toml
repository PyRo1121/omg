# cargo-audit configuration.
#
# ADVISORY-IGNORE AUTHORITY: deny.toml [advisories] is the single source of
# truth for ignored advisories. cargo-audit cannot read deny.toml, so the
# entry below MIRRORS it — when adding or removing an advisory ignore,
# update BOTH files in the same change or CI drifts between the two tools.
[advisories]
ignore = [
  # No patched rsa release exists. OMG uses rsa only for public-key signature
  # verification and never performs network-observable private-key decryption.
  # Mirrored from deny.toml [advisories].ignore (RUSTSEC-2023-0071).
  "RUSTSEC-2023-0071",
]
