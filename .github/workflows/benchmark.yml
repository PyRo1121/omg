name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "benchmark.sh"
      - "benchmark-hyperfine.sh"
      - "benches/**"
      - "benchmarks/**"
      - "scripts/check-perf-regression.py"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    timeout-minutes: 30
    outputs:
      search_time: ${{ steps.bench.outputs.search_time }}
      speedup: ${{ steps.bench.outputs.speedup }}

    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl pkgconf openssl libarchive clang bc python sccache hyperfine jq
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        continue-on-error: true

      - name: Configure sccache
        run: |
          if command -v sccache &> /dev/null && sccache --start-server 2>/dev/null; then
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "::notice::sccache enabled"
          else
            echo "::warning::sccache unavailable, building without cache"
          fi

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: bench-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-registry-

      - name: Cache target directory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: bench-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bench-target-${{ hashFiles('**/Cargo.lock') }}-
            bench-target-

      - name: Build Release
        run: cargo build --release --features arch --locked

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Run Benchmarks (Hyperfine)
        id: bench
        run: |
          set -o pipefail

          chmod +x benchmark-hyperfine.sh

          # Use hyperfine for statistical rigor and JSON export
          ./benchmark-hyperfine.sh --fast 2>&1 | tee benchmark_output.txt

          # Extract metrics from the hyperfine search JSON. Command names come
          # from --command-name in benchmark-hyperfine.sh.
          SEARCH_JSON="benchmark_results/search.json"
          if [ ! -f "$SEARCH_JSON" ]; then
            echo "::error::hyperfine did not produce $SEARCH_JSON"
            exit 1
          fi

          SEARCH_TIME=$(jq -r '.results[] | select(.command == "OMG (Daemon)") | .mean' "$SEARCH_JSON" | awk '{printf "%.1f", $1 * 1000}')
          echo "search_time=${SEARCH_TIME}" >> $GITHUB_OUTPUT

          PACMAN_TIME=$(jq -r '.results[] | select(.command == "pacman") | .mean' "$SEARCH_JSON" | awk '{printf "%.1f", $1 * 1000}')
          if [ -n "$SEARCH_TIME" ] && [ -n "$PACMAN_TIME" ] && [ "$SEARCH_TIME" != "0" ]; then
            SPEEDUP=$(echo "scale=1; $PACMAN_TIME / $SEARCH_TIME" | bc)
            echo "speedup=${SPEEDUP}x" >> $GITHUB_OUTPUT
          fi

      - name: Performance Regression Gate
        run: |
          chmod +x scripts/check-perf-regression.py
          python3 scripts/check-perf-regression.py

      - name: Generate Badge JSON
        env:
          BENCH_SPEEDUP: ${{ steps.bench.outputs.speedup }}
          BENCH_SEARCH_TIME: ${{ steps.bench.outputs.search_time }}
        run: |
          [[ "$BENCH_SEARCH_TIME" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$BENCH_SPEEDUP" =~ ^[0-9]+([.][0-9]+)?x$ ]]

          jq -n \
            --arg message "${BENCH_SEARCH_TIME}ms (${BENCH_SPEEDUP} faster)" \
            '{schemaVersion: 1, label: "search", message: $message, color: "brightgreen"}' \
            > benchmark-badge.json

          cat benchmark-badge.json

      - name: Upload Benchmark Report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-report
          path: |
            benchmark_results/
            benchmark-badge.json
            benchmark_output.txt
          retention-days: 90


  commit-results:
    name: Commit Benchmark Results
    needs: benchmark
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: benchmark-report
          path: benchmark-artifact

      - name: Prepare benchmark history
        env:
          BENCH_SPEEDUP: ${{ needs.benchmark.outputs.speedup }}
          BENCH_SEARCH_TIME: ${{ needs.benchmark.outputs.search_time }}
        run: |
          [[ "$BENCH_SEARCH_TIME" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$BENCH_SPEEDUP" =~ ^[0-9]+([.][0-9]+)?x$ ]]
          test -f benchmark-artifact/benchmark_results/search.md
          test -f benchmark-artifact/benchmark-badge.json
          mkdir -p benchmarks

          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          cp benchmark-artifact/benchmark_results/search.md "benchmarks/report_${TIMESTAMP}.md"
          cp benchmark-artifact/benchmark_results/search.md benchmarks/latest.md
          cp benchmark-artifact/benchmark-badge.json benchmarks/badge.json

          jq -n \
            --arg timestamp "$(date -u -Iseconds)" \
            --argjson search_ms "$BENCH_SEARCH_TIME" \
            --arg speedup "$BENCH_SPEEDUP" \
            --arg commit "$GITHUB_SHA" \
            '{timestamp: $timestamp, search_ms: $search_ms, speedup: $speedup, commit: $commit}' \
            > benchmarks/summary.json

      - name: Commit benchmark history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/
          if git diff --staged --quiet; then
            echo "No benchmark changes to commit"
            exit 0
          fi
          git commit -m "Update benchmark results [skip ci]"
          git push
