name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'benchmark.sh'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    timeout-minutes: 30

    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git rust cargo pkgconf openssl libarchive clang bc python python-pip sccache hyperfine jq

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        continue-on-error: true

      - name: Configure sccache
        run: |
          if command -v sccache &> /dev/null && sccache --start-server 2>/dev/null; then
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "::notice::sccache enabled"
          else
            echo "::warning::sccache unavailable, building without cache"
          fi

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: bench-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-registry-

      - name: Cache target directory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: bench-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs') }}
          restore-keys: |
            bench-target-${{ hashFiles('**/Cargo.lock') }}-
            bench-target-

      - name: Build Release
        run: cargo build --release --features arch --locked

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Run Benchmarks (Hyperfine)
        id: bench
        run: |
          chmod +x benchmark-hyperfine.sh benchmark.sh
          
          # Use hyperfine for statistical rigor and JSON export
          ./benchmark-hyperfine.sh --fast 2>&1 | tee benchmark_output.txt
          
          # Extract metrics from hyperfine JSON output (if available)
          if [ -f "benchmark_results.json" ]; then
            SEARCH_TIME=$(jq -r '.results[] | select(.command | contains("omg search")) | .mean' benchmark_results.json | awk '{printf "%.1f", $1 * 1000}')
            echo "search_time=${SEARCH_TIME}" >> $GITHUB_OUTPUT
            
            PACMAN_TIME=$(jq -r '.results[] | select(.command | contains("pacman -Ss")) | .mean' benchmark_results.json | awk '{printf "%.1f", $1 * 1000}')
            if [ -n "$SEARCH_TIME" ] && [ -n "$PACMAN_TIME" ] && [ "$SEARCH_TIME" != "0" ]; then
              SPEEDUP=$(echo "scale=1; $PACMAN_TIME / $SEARCH_TIME" | bc)
              echo "speedup=${SPEEDUP}x" >> $GITHUB_OUTPUT
            fi
          else
            # Fallback to original benchmark.sh if hyperfine not available
            ./benchmark.sh --fast 2>&1 | tee benchmark_output_fallback.txt
            SEARCH_TIME=$(grep "| search |" benchmark_report.md | awk -F'|' '{print $3}' | tr -d ' ms')
            echo "search_time=${SEARCH_TIME}" >> $GITHUB_OUTPUT
            
            PACMAN_TIME=$(grep "| search |" benchmark_report.md | awk -F'|' '{print $4}' | tr -d ' ms')
            if [ -n "$SEARCH_TIME" ] && [ -n "$PACMAN_TIME" ] && [ "$SEARCH_TIME" != "0" ]; then
              SPEEDUP=$(echo "scale=1; $PACMAN_TIME / $SEARCH_TIME" | bc)
              echo "speedup=${SPEEDUP}x" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Performance Regression Gate
        run: |
          chmod +x scripts/check-perf-regression.py
          python3 scripts/check-perf-regression.py

      - name: Generate Badge JSON
        env:
          BENCH_SPEEDUP: ${{ steps.bench.outputs.speedup }}
          BENCH_SEARCH_TIME: ${{ steps.bench.outputs.search_time }}
        run: |
          [[ "$BENCH_SEARCH_TIME" =~ ^[0-9]+([.][0-9]+)?$ ]]
          [[ "$BENCH_SPEEDUP" =~ ^[0-9]+([.][0-9]+)?x$ ]]

          jq -n \
            --arg message "${BENCH_SEARCH_TIME}ms (${BENCH_SPEEDUP} faster)" \
            '{schemaVersion: 1, label: "search", message: $message, color: "brightgreen"}' \
            > benchmark-badge.json

          cat benchmark-badge.json

      - name: Upload Benchmark Report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-report
          path: |
            benchmark_report.md
            benchmark-badge.json
            benchmark_results.json
            benchmark_output.txt
          retention-days: 90

      - name: Update Benchmark Results
        if: github.ref == 'refs/heads/main'
        env:
          BENCH_SPEEDUP: ${{ steps.bench.outputs.speedup }}
          BENCH_SEARCH_TIME: ${{ steps.bench.outputs.search_time }}
        run: |
          mkdir -p benchmarks

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          cp benchmark_report.md "benchmarks/report_${TIMESTAMP}.md"
          cp benchmark_report.md benchmarks/latest.md
          cp benchmark-badge.json benchmarks/badge.json

          jq -n \
            --arg timestamp "$(date -Iseconds)" \
            --argjson search_ms "$BENCH_SEARCH_TIME" \
            --arg speedup "$BENCH_SPEEDUP" \
            --arg commit "$GITHUB_SHA" \
            '{timestamp: $timestamp, search_ms: $search_ms, speedup: $speedup, commit: $commit}' \
            > benchmarks/summary.json

      - name: Commit Benchmark Results
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/
          if git diff --staged --quiet; then
            echo "No benchmark changes to commit"
            exit 0
          fi

          git commit -m "Update benchmark results [skip ci]"
          git config credential.helper '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          git push
          git config --unset credential.helper
