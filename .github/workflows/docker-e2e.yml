name: Docker E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly to catch regressions
    - cron: '0 2 * * *'

concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docker-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docker-e2e-

      - name: Build OMG binary
        run: cargo build --release --features arch

      - name: Run Docker E2E Tests
        run: OMG_RUN_DOCKER_TESTS=1 cargo test --features arch --test docker_e2e -- --test-threads=1
        env:
          RUST_BACKTRACE: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: docker-e2e-results
          path: target/debug/
