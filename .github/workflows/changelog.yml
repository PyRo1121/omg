name: Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/changelog.md"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: changelog-generation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Always generate the changelog from main; on `release: published`
          # events the default checkout otherwise selects the release tag.
          ref: main

      - name: Install git-cliff
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: git-cliff

      - name: Generate Changelog
        run: |
          manifest_version=$(awk -F '"' '$1 ~ /^version = / { print $2; exit }' Cargo.toml)
          latest_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [[ "v$manifest_version" != "$latest_tag" ]] \
            && grep -Fq "## [$manifest_version] - " docs/changelog.md; then
            echo "::notice::Keeping the prepared v$manifest_version changelog section until its tag exists"
            exit 0
          fi

          git-cliff --output docs/changelog.md

          # Escape HTML-like tags for MDX compatibility
          sed -i 's/<\([A-Z][a-zA-Z]*\)>/`<\1>`/g' docs/changelog.md

          # Add Docusaurus frontmatter if not present
          if ! grep -q "^---$" docs/changelog.md; then
            {
              echo "---"
              echo "title: Changelog"
              echo "sidebar_position: 99"
              echo "description: Complete version history and release notes"
              echo "---"
              echo ""
              cat docs/changelog.md
            } > docs/changelog.md.tmp
            mv docs/changelog.md.tmp docs/changelog.md
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/changelog.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Changelog updated with new commits"
          fi

      - name: Stage generated changelog
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-changelog
          path: docs/changelog.md
          if-no-files-found: error
          retention-days: 30

      - name: Review summary
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Generated changelog is attached as an artifact. Review it in a PR; this workflow cannot write to main." >> "$GITHUB_STEP_SUMMARY"
