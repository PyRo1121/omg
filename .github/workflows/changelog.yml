name: Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/changelog.md"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: main-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Always generate the changelog from main; on `release: published`
          # events the default checkout lands on a tag (detached HEAD), where
          # a follow-up `git push` would fail.
          ref: main

      - name: Install git-cliff
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: git-cliff

      - name: Generate Changelog
        run: |
          manifest_version=$(awk -F '"' '$1 ~ /^version = / { print $2; exit }' Cargo.toml)
          latest_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [[ "v$manifest_version" != "$latest_tag" ]] \
            && grep -Fq "## [$manifest_version] - " docs/changelog.md; then
            echo "::notice::Keeping the prepared v$manifest_version changelog section until its tag exists"
            exit 0
          fi

          git-cliff --output docs/changelog.md

          # Escape HTML-like tags for MDX compatibility
          sed -i 's/<\([A-Z][a-zA-Z]*\)>/`<\1>`/g' docs/changelog.md

          # Add Docusaurus frontmatter if not present
          if ! grep -q "^---$" docs/changelog.md; then
            {
              echo "---"
              echo "title: Changelog"
              echo "sidebar_position: 99"
              echo "description: Complete version history and release notes"
              echo "---"
              echo ""
              cat docs/changelog.md
            } > docs/changelog.md.tmp
            mv docs/changelog.md.tmp docs/changelog.md
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/changelog.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Changelog updated with new commits"
          fi

      - name: Stage generated changelog
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-changelog
          path: docs/changelog.md
          if-no-files-found: error
          retention-days: 1

  publish-changelog:
    name: Publish Changelog
    needs: generate-changelog
    if: needs.generate-changelog.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - name: Download generated changelog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-changelog
          path: .changelog-artifact

      - name: Validate generated changelog
        shell: bash
        run: |
          set -euo pipefail
          artifact=.changelog-artifact/changelog.md
          if [[ ! -f "$artifact" || -L "$artifact" ]]; then
            echo "::error::Generated changelog is not a regular file"
            exit 1
          fi
          size=$(stat --format='%s' "$artifact")
          if (( size == 0 || size > 5242880 )); then
            echo "::error::Generated changelog has invalid size: $size bytes"
            exit 1
          fi
          install -m 0644 -- "$artifact" docs/changelog.md

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/changelog.md
          git commit -m "docs: update changelog [skip ci]

          Auto-generated from git history with git-cliff."
          trap 'git config --unset credential.helper >/dev/null 2>&1 || true' EXIT
          git config credential.helper '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          git push origin HEAD:main

      - name: Summary
        env:
          CHANGELOG_CHANGED: ${{ needs.generate-changelog.outputs.changed }}
        run: |
          echo "## Changelog Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$CHANGELOG_CHANGED" == "true" ]; then
            echo "✅ Changelog updated and committed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Recent entries:" >> $GITHUB_STEP_SUMMARY
            head -50 docs/changelog.md | tail -40 >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes to changelog" >> $GITHUB_STEP_SUMMARY
          fi
