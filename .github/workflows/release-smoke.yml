name: Release Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/release-smoke.yml"
      - "scripts/release-smoke.sh"
      - "scripts/test-release-smoke.sh"
      - "scripts/test-release-provenance.sh"
      - "scripts/report-smoke-sentry.sh"
      - "scripts/ci-smoke-report.py"
      - "scripts/test_ci_smoke_report.py"
      - "scripts/test_release_workflow_boundaries.py"
      - "tests/cli_behavior_inventory.tsv"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to smoke (e.g. v0.1.217); empty means latest published release"
        required: false
        default: ""
  schedule:
    # Nightly, staggered off qemu-matrix's 03:17 slot. PR/dispatch runs
    # smoke but never file: filing is nightly-only (see file-issues).
    - cron: "23 4 * * *"

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-fixtures:
    name: Runner fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release smoke coordinator
        run: ./scripts/test-release-smoke.sh

      - name: Test native release provenance gate
        run: bash scripts/test-release-provenance.sh

  resolve-release:
    name: Resolve release once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Resolve one release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ "$tag" == latest ]]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [runner-fixtures, resolve-release]
    name: "Smoke ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, ubuntu, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure smoke Sentry reporting (opt-in)
        if: github.event_name != 'pull_request'
        env:
          OMG_SMOKE_SENTRY_DSN: ${{ secrets.OMG_SMOKE_SENTRY_DSN }}
        run: python3 scripts/ci-smoke-report.py configure

      - name: Run release artifact smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          ./scripts/release-smoke.sh \
            --release "$RELEASE_TAG" \
            --distro "${{ matrix.distro }}" \
            --evidence-dir release-smoke-evidence

      - name: Preserve setup failure and surface reporting
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DISTRO: ${{ matrix.distro }}
          OMG_SMOKE_ENVIRONMENT: release-smoke
          OMG_SMOKE_RELEASE: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          evidence="release-smoke-evidence"
          if [[ "$JOB_STATUS" == failure ]] && ! find "$evidence" -name results.json -type f -print -quit 2>/dev/null | grep -q .; then
            python3 scripts/ci-smoke-report.py status --distro "$DISTRO" \
              --case-id "smoke-$DISTRO-setup" --status failure \
              --evidence-dir "$evidence/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          if [[ -d "$evidence" ]]; then
            find "$evidence" -name reporting.log -type f -exec cat {} +
          fi

      - name: Upload per-case evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-${{ matrix.distro }}
          path: release-smoke-evidence/
          if-no-files-found: warn

  smoke-macos:
    needs: [runner-fixtures, resolve-release]
    name: "Smoke macos (native)"
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # The probe refreshes the Homebrew index itself (`brew update`, asserted
      # by the runner fixtures). Letting Homebrew auto-update as well races that
      # explicit refresh and aborts the run with "Another `brew update` process
      # is already running".
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure smoke Sentry reporting (opt-in)
        if: github.event_name != 'pull_request'
        env:
          OMG_SMOKE_SENTRY_DSN: ${{ secrets.OMG_SMOKE_SENTRY_DSN }}
        run: python3 scripts/ci-smoke-report.py configure

      - name: Install GNU timeout
        run: brew install coreutils

      - name: Pin server-computed release digests
        # Native execution runs the extracted release binary directly on this
        # host, so `release-smoke.sh` requires an independently pinned digest.
        # The `.sha256` sidecar ships with the release and an attacker who
        # replaces both assets would defeat it, so pin against the digest
        # GitHub computes server-side from the uploaded bytes instead.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$RELEASE_TAG"
          release_json="$(gh api "repos/${repo}/releases/tags/${tag}")"
          total="$(jq '[.assets[] | select(.name | endswith(".tar.gz"))] | length' <<<"$release_json")"
          pins="$(jq -r '.assets[] | select(.name | endswith(".tar.gz")) | select(.digest != null) | "\(.digest | sub("^sha256:"; ""))  \(.name)"' <<<"$release_json")"
          pinned="$(grep -c . <<<"$pins" || true)"
          if [[ "$total" -eq 0 || "$pinned" -ne "$total" ]]; then
            echo "::error::not every release archive has a server-computed digest (${pinned}/${total}); refusing native execution"
            exit 1
          fi
          printf '%s\n' "$pins" > smoke-digest-pins.txt
          echo "Pinned ${pinned} release archive digest(s) for ${tag}"

      - name: Run release artifact smoke test (native)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          OMG_SMOKE_DIGEST_PIN_FILE: ${{ github.workspace }}/smoke-digest-pins.txt
        run: |
          ./scripts/release-smoke.sh \
            --release "$RELEASE_TAG" \
            --distro macos --executor native \
            --evidence-dir release-smoke-evidence-macos

      - name: Preserve setup failure and surface reporting
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DISTRO: macos
          OMG_SMOKE_ENVIRONMENT: release-smoke
          OMG_SMOKE_RELEASE: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          evidence="release-smoke-evidence-macos"
          if [[ "$JOB_STATUS" == failure ]] && ! find "$evidence" -name results.json -type f -print -quit 2>/dev/null | grep -q .; then
            python3 scripts/ci-smoke-report.py status --distro "$DISTRO" \
              --case-id "smoke-$DISTRO-setup" --status failure \
              --evidence-dir "$evidence/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          if [[ -d "$evidence" ]]; then
            find "$evidence" -name reporting.log -type f -exec cat {} +
          fi

      - name: Upload per-case evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-macos
          path: release-smoke-evidence-macos/
          if-no-files-found: warn

  #########################################################################
  # File/update one issue per QA failure (nightly only).
  # One-time bootstrap: create the `qa-failure` label in repo settings.
  # Filing failures remain visible; test conclusions are retained separately.
  #########################################################################
  file-issues:
    name: "File QA issues"
    needs: [smoke, smoke-macos]
    if: always() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-smoke-*
          path: evidence/
          merge-multiple: false

      - name: File or update failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          shopt -s nullglob globstar
          reports=(evidence/**/results.json)
          (( ${#reports[@]} > 0 )) || { echo "::error::No smoke reports downloaded"; exit 1; }
          for results in "${reports[@]}"; do
            ./scripts/qa-file-issue.sh "$results" --run-url "$run_url" --source release-smoke
          done
