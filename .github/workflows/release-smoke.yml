name: Release Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/release-smoke.yml"
      - "scripts/release-smoke.sh"
      - "scripts/test-release-smoke.sh"
      - "scripts/report-smoke-sentry.sh"
      - "tests/cli_behavior_inventory.tsv"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to smoke (e.g. v0.1.217); empty means latest published release"
        required: false
        default: ""
  schedule:
    # Nightly, staggered off qemu-matrix's 03:17 slot. PR/dispatch runs
    # smoke but never file: filing is nightly-only (see file-issues).
    - cron: "23 4 * * *"

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-fixtures:
    name: Runner fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release smoke coordinator
        run: ./scripts/test-release-smoke.sh

  smoke:
    name: "Smoke ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, ubuntu, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure smoke Sentry reporting (opt-in)
        # Without this file report-smoke-sentry.sh exits 0 silently, so a
        # missing secret must be a visible notice, not a quiet no-op.
        run: |
          if [[ -n "${{ secrets.OMG_SMOKE_SENTRY_DSN }}" ]]; then
            dsn='${{ secrets.OMG_SMOKE_SENTRY_DSN }}'
            [[ "$dsn" =~ ^https://[A-Za-z0-9]+@[a-z0-9.-]+\.sentry\.io/[0-9]+$ ]] || { echo "::error::OMG_SMOKE_SENTRY_DSN has an unexpected shape"; exit 1; }
            mkdir -p ~/.config/omg-smoke
            jq -Rn --arg dsn "$dsn" '{dsn:$dsn}' > ~/.config/omg-smoke/sentry.json
            chmod 600 ~/.config/omg-smoke/sentry.json
            echo "Sentry smoke reporting enabled"
          else
            echo "Sentry smoke reporting disabled: OMG_SMOKE_SENTRY_DSN secret is not set"
          fi

      - name: Run release artifact smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
        run: |
          ./scripts/release-smoke.sh \
            --release "$RELEASE_TAG" \
            --distro "${{ matrix.distro }}" \
            --evidence-dir release-smoke-evidence

      - name: Upload per-case evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-${{ matrix.distro }}
          path: release-smoke-evidence/
          if-no-files-found: warn

  smoke-macos:
    name: "Smoke macos (native)"
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure smoke Sentry reporting (opt-in)
        # Same opt-in as the container legs; without this file
        # report-smoke-sentry.sh exits 0 silently.
        run: |
          if [[ -n "${{ secrets.OMG_SMOKE_SENTRY_DSN }}" ]]; then
            dsn='${{ secrets.OMG_SMOKE_SENTRY_DSN }}'
            [[ "$dsn" =~ ^https://[A-Za-z0-9]+@[a-z0-9.-]+\.sentry\.io/[0-9]+$ ]] || { echo "::error::OMG_SMOKE_SENTRY_DSN has an unexpected shape"; exit 1; }
            mkdir -p ~/.config/omg-smoke
            jq -Rn --arg dsn "$dsn" '{dsn:$dsn}' > ~/.config/omg-smoke/sentry.json
            chmod 600 ~/.config/omg-smoke/sentry.json
            echo "Sentry smoke reporting enabled"
          else
            echo "Sentry smoke reporting disabled: OMG_SMOKE_SENTRY_DSN secret is not set"
          fi

      - name: Install GNU timeout
        run: brew install coreutils

      - name: Run release artifact smoke test (native)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
        run: |
          ./scripts/release-smoke.sh \
            --release "$RELEASE_TAG" \
            --distro macos --executor native \
            --evidence-dir release-smoke-evidence-macos

      - name: Upload per-case evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-macos
          path: release-smoke-evidence-macos/
          if-no-files-found: warn

  #########################################################################
  # File/update one issue per QA failure (nightly only).
  # One-time bootstrap: create the `qa-failure` label in repo settings.
  # continue-on-error: filing must never fail the build.
  #########################################################################
  file-issues:
    name: "File QA issues"
    needs: [smoke, smoke-macos]
    if: always() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-smoke-*
          path: evidence/
          merge-multiple: true

      - name: File or update failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          shopt -s nullglob
          for results in evidence/**/results.json; do
            ./scripts/qa-file-issue.sh "$results" --run-url "$run_url" --source release-smoke
          done
