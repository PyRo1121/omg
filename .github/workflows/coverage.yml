name: Code Coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git rustup pkgconf openssl libarchive clang cmake
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install coverage tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: coverage-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: coverage-registry-

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: coverage-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs') }}
          restore-keys: |
            coverage-target-${{ hashFiles('**/Cargo.lock') }}-
            coverage-target-

      # Run tests once with --no-report, then generate reports separately
      # This avoids running the full test suite 3 times
      - name: Run tests with coverage instrumentation
        run: |
          cargo llvm-cov nextest \
            --features arch,pgp,license \
            --locked \
            --no-fail-fast \
            --no-report
        continue-on-error: true

      - name: Generate LCOV report
        if: always()
        run: |
          cargo llvm-cov report \
            --features arch,pgp,license \
            --lcov \
            --output-path lcov.info
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Generate HTML report
        if: always()
        run: |
          cargo llvm-cov report \
            --features arch,pgp,license \
            --html
        continue-on-error: true

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report \
            --features arch,pgp,license \
            --summary-only \
            | tee -a $GITHUB_STEP_SUMMARY
        continue-on-error: true
