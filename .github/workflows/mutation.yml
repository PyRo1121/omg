name: Mutation Testing

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mutation:
    name: cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "mutation"
          cache-on-failure: true

      - name: Install cargo-mutants
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-mutants

      - name: Run mutation testing
        run: |
          # Run on core modules only (full codebase would take too long)
          cargo mutants \
            --package omg_lib \
            --timeout 60 \
            --jobs 2 \
            --exclude-re 'tests?|bench|mock' \
            --output-html mutants-report \
            -- --no-default-features --features pgp,license
        continue-on-error: true

      - name: Upload mutation report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: mutation-report
          path: mutants-report/
          retention-days: 30

      - name: Check mutation score
        run: |
          if [ -f mutants-report/mutants.json ]; then
            total=$(jq '.outcomes | length' mutants-report/mutants.json)
            caught=$(jq '[.outcomes[] | select(.outcome == "Caught")] | length' mutants-report/mutants.json)
            if [ "$total" -gt 0 ]; then
              score=$((caught * 100 / total))
              echo "Mutation score: $score% ($caught/$total mutants caught)"
              # Warn if mutation score is below target (75% industry best practice)
              if [ "$score" -lt 75 ]; then
                echo "::warning::Mutation score $score% is below 75% target. Tests may not be catching all bugs."
              else
                echo "::notice::Mutation score $score% meets 75% target"
              fi
            fi
          fi
