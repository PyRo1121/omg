name: Mutation Testing

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mutation:
    name: cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "mutation"
          cache-on-failure: true

      - name: Install cargo-mutants
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutation testing
        run: |
          set +e
          cargo mutants \
            --package omg \
            --file src/core/archive.rs \
            --file src/core/runtime_resolver.rs \
            --file src/core/security/validation.rs \
            --file src/core/security/policy.rs \
            --file src/core/security/secrets.rs \
            --timeout 60 \
            --jobs 2 \
            --exclude-re 'tests?|bench|mock' \
            --output mutants-report \
            --no-default-features \
            --features pgp,license
          mutants_exit=$?
          set -e

          case "$mutants_exit" in
            0|2|3) ;;
            *)
              echo "cargo-mutants failed with exit code $mutants_exit" >&2
              exit "$mutants_exit"
              ;;
          esac

      - name: Upload mutation report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: mutation-report
          path: mutants-report/
          retention-days: 30

      - name: Check mutation score
        run: |
          result_dir="mutants-report/mutants.out"
          for report in caught.txt missed.txt timeout.txt; do
            if [ ! -f "$result_dir/$report" ]; then
              echo "Missing mutation report: $result_dir/$report" >&2
              exit 1
            fi
          done

          caught=$(wc -l < "$result_dir/caught.txt")
          missed=$(wc -l < "$result_dir/missed.txt")
          timed_out=$(wc -l < "$result_dir/timeout.txt")
          total=$((caught + missed + timed_out))
          if [ "$total" -eq 0 ]; then
            echo "Mutation run tested zero viable mutants" >&2
            exit 1
          fi

          score=$((caught * 100 / total))
          echo "Mutation score: $score% ($caught/$total mutants caught; $missed missed; $timed_out timed out)"
          if [ "$score" -lt 75 ]; then
            echo "Mutation score $score% is below the required 75% threshold" >&2
            exit 1
          fi
          echo "::notice::Mutation score $score% meets the 75% threshold"
