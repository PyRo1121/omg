name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: TruffleHog OSS (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Resolve TruffleHog scan base (Push)
        id: hog_base
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"

          # `github.event.before` is all-zeros on a branch's first push and may
          # be absent locally after a force-push. Try fetching the exact object;
          # if GitHub no longer serves it, scan from the oldest reachable commit
          # rather than comparing the default branch to itself (which can be an
          # empty range when the default branch is the pushed branch).
          if [[ -n "$BEFORE" ]] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null \
              || true
          fi

          if [[ -n "$BEFORE" ]] \
             && [[ ! "$BEFORE" =~ ^0+$ ]] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git rev-list --max-parents=0 "$GITHUB_SHA" | head -n 1)"
            test -n "$base"
            echo "::notice::Push base unavailable; scanning reachable history from $base"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: TruffleHog OSS (Push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          base: ${{ steps.hog_base.outputs.base }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: TruffleHog OSS (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          extra_args: --only-verified --since-commit HEAD~5
