name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish)'
        required: false
        default: 'true'

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # BUILD RELEASE ARTIFACTS
  # ════════════════════════════════════════════════════════════════════════════

  build-arch:
    name: "Build Arch"
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git rust cargo pkgconf openssl libarchive clang

      - uses: actions/checkout@v4

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          export RUSTFLAGS="-C target-cpu=x86-64-v2"
          cargo build --release --features arch

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-arch"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-arch/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-arch/" 2>/dev/null || true
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-arch/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-arch.tar.gz" "omg-v${VERSION}-x86_64-linux-arch"
          sha256sum "omg-v${VERSION}-x86_64-linux-arch.tar.gz" > "omg-v${VERSION}-x86_64-linux-arch.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-build
          path: omg-v*.tar.gz*

  build-debian:
    name: "Build Debian"
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libapt-pkg-dev \
            clang \
            cmake
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo 'export PATH="$CARGO_HOME/bin:$PATH"' >> $GITHUB_ENV

      - name: Build
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo build --release --no-default-features --features debian

      - name: Package
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-debian"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-debian/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-debian/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-debian.tar.gz" "omg-v${VERSION}-x86_64-linux-debian"
          sha256sum "omg-v${VERSION}-x86_64-linux-debian.tar.gz" > "omg-v${VERSION}-x86_64-linux-debian.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: debian-build
          path: omg-v*.tar.gz*

  build-ubuntu:
    name: "Build Ubuntu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libapt-pkg-dev \
            pkg-config \
            libssl-dev \
            clang \
            cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --no-default-features --features debian

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-ubuntu"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-ubuntu/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-ubuntu/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" "omg-v${VERSION}-x86_64-linux-ubuntu"
          sha256sum "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" > "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-build
          path: omg-v*.tar.gz*

  build-fedora:
    name: "Build Fedora"
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git clang cmake openssl-devel pkgconfig findutils curl \
            rpm dnf sqlite yum-utils fedora-release
          rpm --initdb
          dnf makecache --refresh
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.92.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/checkout@v4

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --no-default-features --features fedora,pgp,license --locked

      - name: Package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-fedora"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-fedora/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-fedora/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-fedora.tar.gz" "omg-v${VERSION}-x86_64-linux-fedora"
          sha256sum "omg-v${VERSION}-x86_64-linux-fedora.tar.gz" > "omg-v${VERSION}-x86_64-linux-fedora.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-build
          path: omg-v*.tar.gz*

  build-macos:
    name: "Build macOS (ARM64)"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --no-default-features --features macos,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-aarch64-darwin"
          cp target/release/omg "omg-v${VERSION}-aarch64-darwin/"
          cp README.md LICENSE "omg-v${VERSION}-aarch64-darwin/"
          tar -czf "omg-v${VERSION}-aarch64-darwin.tar.gz" "omg-v${VERSION}-aarch64-darwin"
          shasum -a 256 "omg-v${VERSION}-aarch64-darwin.tar.gz" > "omg-v${VERSION}-aarch64-darwin.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: omg-v*.tar.gz*

  build-windows:
    name: "Build Windows (x64)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --no-default-features --features windows,pgp,license --locked

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          $dirname = "omg-v$version-x86_64-windows"
          New-Item -ItemType Directory -Force -Path $dirname
          Copy-Item target/release/omg.exe "$dirname/"
          Copy-Item README.md,LICENSE "$dirname/"
          Compress-Archive -Path $dirname -DestinationPath "$dirname.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$dirname.zip").Hash.ToLower()
          "$hash  $dirname.zip" | Out-File -Encoding ascii "$dirname.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: omg-v*.zip*

  # ════════════════════════════════════════════════════════════════════════════
  # PUBLISH RELEASE
  # ════════════════════════════════════════════════════════════════════════════

  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [build-arch, build-debian, build-ubuntu, build-fedora, build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Files
        run: |
          mkdir release
          find artifacts -name "*.tar.gz*" -exec cp {} release/ \;
          find artifacts -name "*.zip*" -exec cp {} release/ \;
          ls -la release/

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cat > release_notes.md << EOF
          ## OMG v${VERSION}
          
          ### Installation
          
          **Quick Install (Linux/macOS):**
          \`\`\`bash
          curl -fsSL https://pyro1121.com/install.sh | bash
          \`\`\`
          
          **Windows (PowerShell):**
          \`\`\`powershell
          irm https://pyro1121.com/install.ps1 | iex
          \`\`\`
          
          ### Platform Support
          
          | Platform | Architecture | Binary |
          |----------|--------------|--------|
          | Arch Linux | x86_64 | \`omg-v${VERSION}-x86_64-linux-arch.tar.gz\` |
          | Debian | x86_64 | \`omg-v${VERSION}-x86_64-linux-debian.tar.gz\` |
          | Ubuntu | x86_64 | \`omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz\` |
          | Fedora/RHEL | x86_64 | \`omg-v${VERSION}-x86_64-linux-fedora.tar.gz\` |
          | macOS | ARM64 | \`omg-v${VERSION}-aarch64-darwin.tar.gz\` |
          | Windows | x64 | \`omg-v${VERSION}-x86_64-windows.zip\` |
          
          ### Manual Installation
          
          **Linux/macOS:**
          \`\`\`bash
          tar -xzf omg-v${VERSION}-*.tar.gz
          cd omg-v${VERSION}-*
          sudo cp omg /usr/local/bin/
          \`\`\`
          
          **Windows:**
          \`\`\`powershell
          Expand-Archive omg-v${VERSION}-x86_64-windows.zip
          Move-Item omg-v${VERSION}-x86_64-windows/omg.exe \$env:LOCALAPPDATA/Programs/
          \`\`\`
          
          ### Verification
          
          All binaries include SHA256 checksums. Verify downloads:
          
          **Linux/macOS:**
          \`\`\`bash
          sha256sum -c omg-v${VERSION}-*.sha256
          \`\`\`
          
          **Windows (PowerShell):**
          \`\`\`powershell
          (Get-FileHash omg.exe).Hash -eq (Get-Content omg-*.sha256).Split()[0]
          \`\`\`
          
          ### What's New
          
          See [CHANGELOG.md](https://github.com/PyRo1121/omg/blob/main/docs/changelog.md) for details.
          EOF

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        with:
          body_path: release_notes.md
          files: release/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
