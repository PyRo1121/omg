name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish)"
        required: false
        default: "true"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # BUILD RELEASE ARTIFACTS
  # ════════════════════════════════════════════════════════════════════════════

  build-arch:
    name: "Build Arch"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl pkgconf openssl libarchive clang
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          export RUSTFLAGS="-C target-cpu=x86-64-v2"
          cargo build --release --no-default-features --features arch,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-arch"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-arch/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-arch/" 2>/dev/null || true
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-arch/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-arch.tar.gz" "omg-v${VERSION}-x86_64-linux-arch"
          sha256sum "omg-v${VERSION}-x86_64-linux-arch.tar.gz" > "omg-v${VERSION}-x86_64-linux-arch.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arch-build
          path: omg-v*.tar.gz*

  build-debian:
    name: "Build Debian"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libapt-pkg-dev \
            clang \
            cmake
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
          echo 'export PATH="$CARGO_HOME/bin:$PATH"' >> $GITHUB_ENV

      - name: Build
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo build --release --no-default-features --features debian,pgp,license --locked

      - name: Package
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-debian"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-debian/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-debian/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-debian.tar.gz" "omg-v${VERSION}-x86_64-linux-debian"
          sha256sum "omg-v${VERSION}-x86_64-linux-debian.tar.gz" > "omg-v${VERSION}-x86_64-linux-debian.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debian-build
          path: omg-v*.tar.gz*

  build-ubuntu:
    name: "Build Ubuntu"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libapt-pkg-dev \
            pkg-config \
            libssl-dev \
            clang \
            cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build
        run: cargo build --release --no-default-features --features debian,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-ubuntu"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-ubuntu/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-ubuntu/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" "omg-v${VERSION}-x86_64-linux-ubuntu"
          sha256sum "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" > "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ubuntu-build
          path: omg-v*.tar.gz*

  build-fedora:
    name: "Build Fedora"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:latest@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    steps:
      - name: Install Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git clang cmake openssl-devel pkgconfig findutils curl \
            rpm dnf sqlite yum-utils fedora-release
          rpm --initdb
          dnf makecache --refresh
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --no-default-features --features fedora,pgp,license --locked

      - name: Package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-fedora"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-fedora/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-fedora/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-fedora.tar.gz" "omg-v${VERSION}-x86_64-linux-fedora"
          sha256sum "omg-v${VERSION}-x86_64-linux-fedora.tar.gz" > "omg-v${VERSION}-x86_64-linux-fedora.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fedora-build
          path: omg-v*.tar.gz*

  build-macos:
    name: "Build macOS (ARM64)"
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build
        run: cargo build --release --no-default-features --features macos,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-aarch64-darwin"
          cp target/release/omg "omg-v${VERSION}-aarch64-darwin/"
          cp README.md LICENSE "omg-v${VERSION}-aarch64-darwin/"
          tar -czf "omg-v${VERSION}-aarch64-darwin.tar.gz" "omg-v${VERSION}-aarch64-darwin"
          shasum -a 256 "omg-v${VERSION}-aarch64-darwin.tar.gz" > "omg-v${VERSION}-aarch64-darwin.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-build
          path: omg-v*.tar.gz*

  # ════════════════════════════════════════════════════════════════════════════
  # PUBLISH RELEASE
  # ════════════════════════════════════════════════════════════════════════════

  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-arch, build-debian, build-ubuntu, build-fedora, build-macos]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Install SBOM metadata toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: "1.93.1"

      - name: Install SBOM generator
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate locked CycloneDX SBOM
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cargo metadata --locked --format-version 1 > /dev/null
          cargo cyclonedx --format json --all-features --target all \
            --override-filename "omg-v${VERSION}.cdx"
          test -s "omg-v${VERSION}.cdx.json"
          git diff --exit-code -- Cargo.lock
          mkdir -p artifacts/release-metadata
          mv "omg-v${VERSION}.cdx.json" artifacts/release-metadata/

      - name: Upload release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-metadata
          path: artifacts/release-metadata/omg-v*.cdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Collect and verify exact release files
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ./scripts/collect-release-artifacts.sh "$VERSION" artifacts release

      - name: Attest release archives and SBOM
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/*.tar.gz
            release/*.cdx.json

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          cat > release_notes.md << 'EOF_HEADER'
          ## Installation

          **Quick Install (Linux/macOS):**
          ```bash
          curl -fsSL https://pyro1121.com/install.sh | bash
          ```

          **Windows Subsystem for Linux:** Use the Linux installer inside your WSL distribution.

          EOF_HEADER

          echo "" >> release_notes.md
          echo "## What's New in v${VERSION}" >> release_notes.md
          echo "" >> release_notes.md

          if ./scripts/extract-release-notes.sh "${VERSION}" >> release_notes.md 2>/dev/null; then
            echo "✓ Extracted changelog for v${VERSION}"
          else
            echo "⚠ No changelog found, using generic message"
            echo "See [full changelog](https://github.com/PyRo1121/omg/blob/main/docs/changelog.md) for details." >> release_notes.md
          fi

          cat >> release_notes.md << EOF_FOOTER

          ---

          ## Platform Support

          | Platform | Architecture | Binary |
          |----------|--------------|--------|
          | Arch Linux | x86_64 | \`omg-v${VERSION}-x86_64-linux-arch.tar.gz\` |
          | Debian | x86_64 | \`omg-v${VERSION}-x86_64-linux-debian.tar.gz\` |
          | Ubuntu | x86_64 | \`omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz\` |
          | Fedora/RHEL | x86_64 | \`omg-v${VERSION}-x86_64-linux-fedora.tar.gz\` |
          | macOS | ARM64 | \`omg-v${VERSION}-aarch64-darwin.tar.gz\` |
          | WSL | x86_64 | Use the binary matching the installed Linux distribution |

          ## Verification

          Verify the downloaded archive before extracting or installing it:

          **Linux:**
          \`\`\`bash
          sha256sum -c omg-v${VERSION}-*.sha256
          \`\`\`

          **macOS:**
          \`\`\`bash
          shasum -a 256 -c omg-v${VERSION}-*.sha256
          \`\`\`

          ## Manual Installation

          **Linux/macOS:**
          \`\`\`bash
          tar -xzf omg-v${VERSION}-*.tar.gz
          cd omg-v${VERSION}-*
          sudo cp omg /usr/local/bin/
          \`\`\`

          ---

          **Full Changelog**: https://github.com/PyRo1121/omg/blob/main/docs/changelog.md
          EOF_FOOTER

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Generated Release Notes Preview:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat release_notes.md
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        with:
          body_path: release_notes.md
          files: release/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  # ════════════════════════════════════════════════════════════════════════════
  # SYNC TO CLOUDFLARE R2 (releases.pyro1121.com)
  # ════════════════════════════════════════════════════════════════════════════

  sync-r2:
    name: "Sync to Cloudflare R2"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    needs: [release]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Collect and verify exact release files
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ./scripts/collect-release-artifacts.sh "$VERSION" artifacts release

      - name: Upload latest-version marker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo -n "$VERSION" > release/latest-version
          npx --yes wrangler@4.123.0 r2 object put "omg-releases/latest-version" \
            --file=release/latest-version \
            --content-type="text/plain"
          echo "✓ Updated latest-version → $VERSION"

      - name: Upload release artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for artifact in release/omg-v*.tar.gz; do
            [ -f "$artifact" ] || continue
            basename=$(basename "$artifact")
            content_type="application/octet-stream"
            npx --yes wrangler@4.123.0 r2 object put "omg-releases/$basename" \
              --file="$artifact" \
              --content-type="$content_type"
            echo "✓ Uploaded $basename"
          done

          for checksum in release/omg-v*.sha256; do
            [ -f "$checksum" ] || continue
            basename=$(basename "$checksum")
            npx --yes wrangler@4.123.0 r2 object put "omg-releases/$basename" \
              --file="$checksum" \
              --content-type="text/plain"
            echo "✓ Uploaded $basename"
          done
