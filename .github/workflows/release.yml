name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish)"
        required: false
        default: "true"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # GATE ON CI
  #
  # release.yml triggers independently of ci.yml, so without this job a tag
  # could be published while CI is red. Publishing is only allowed for a
  # commit that already has a *successful* CI run. The only bypass is a pure
  # no-op dry run via workflow_dispatch.
  # ════════════════════════════════════════════════════════════════════════════
  gate-on-ci:
    name: "Gate on CI"
    runs-on: ubuntu-latest
    # Long enough to watch (not just poll) an in-progress CI run to completion;
    # a tag pushed seconds after `main` lands must not miss the run.
    timeout-minutes: 40
    permissions:
      actions: read
    steps:
      - name: Require successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "No-op dry run requested — CI gate not required"
            exit 0
          fi

          # Any *completed successful* run for this commit satisfies the gate.
          if gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --status success \
              --limit 1 \
            | grep -q .; then
            echo "✓ CI gate passed for $GITHUB_SHA"
            exit 0
          fi

          # No completed run yet: if one is in progress or queued, WAIT for it
          # instead of failing on a just-pushed tag (the gate previously raced
          # tags pushed to main immediately after the commit landed).
          echo "No completed CI run yet; waiting for in-flight runs..."
          pending="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --json databaseId,status \
            --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId')"

          if [[ -z "$pending" ]]; then
            echo "::error::No successful or in-progress CI run found for commit $GITHUB_SHA. Fix CI before releasing, or re-tag after CI passes." >&2
            exit 1
          fi

          failed=false
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Watching CI run $run_id for $GITHUB_SHA..."
            # gh run watch exits non-zero if the watched run fails; treat every
            # leg of the check as mandatory — a red CI blocks the release.
            if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
              echo "::error::CI run $run_id failed for commit $GITHUB_SHA. Releases may only be built from green commits." >&2
              failed=true
            fi
          done <<< "$pending"

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
          echo "✓ CI gate passed for $GITHUB_SHA"

  # ════════════════════════════════════════════════════════════════════════════
  # BUILD RELEASE ARTIFACTS
  # ════════════════════════════════════════════════════════════════════════════

  build-arch:
    name: "Build Arch"
    needs: gate-on-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl pkgconf openssl libarchive clang
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
          rm -f /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          export RUSTFLAGS="-C target-cpu=x86-64-v2"
          cargo build --release --no-default-features --features arch,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-arch"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-arch/"
          cp target/release/omgd "omg-v${VERSION}-x86_64-linux-arch/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-arch/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-arch.tar.gz" "omg-v${VERSION}-x86_64-linux-arch"
          sha256sum "omg-v${VERSION}-x86_64-linux-arch.tar.gz" > "omg-v${VERSION}-x86_64-linux-arch.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arch-build
          path: omg-v*.tar.gz*

  build-debian:
    name: "Build Debian"
    needs: gate-on-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libapt-pkg-dev \
            clang \
            cmake
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
          echo 'export PATH="$CARGO_HOME/bin:$PATH"' >> $GITHUB_ENV

      - name: Build
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo build --release --no-default-features --features debian,pgp,license --locked

      - name: Package
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-debian"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-debian/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-debian/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-debian.tar.gz" "omg-v${VERSION}-x86_64-linux-debian"
          sha256sum "omg-v${VERSION}-x86_64-linux-debian.tar.gz" > "omg-v${VERSION}-x86_64-linux-debian.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debian-build
          path: omg-v*.tar.gz*

  build-ubuntu:
    name: "Build Ubuntu"
    needs: gate-on-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libapt-pkg-dev \
            pkg-config \
            libssl-dev \
            clang \
            cmake

      - name: Install Rust toolchain
        # Match rust-toolchain.toml (1.93.1) instead of floating "stable"
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.93.1"

      - name: Build
        run: cargo build --release --no-default-features --features debian,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-ubuntu"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-ubuntu/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-ubuntu/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" "omg-v${VERSION}-x86_64-linux-ubuntu"
          sha256sum "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz" > "omg-v${VERSION}-x86_64-linux-ubuntu.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ubuntu-build
          path: omg-v*.tar.gz*

  build-fedora:
    name: "Build Fedora"
    needs: gate-on-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:latest@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    steps:
      - name: Install Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git clang cmake openssl-devel pkgconfig findutils curl \
            rpm dnf sqlite yum-utils fedora-release
          rpm --initdb
          dnf makecache --refresh
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --no-default-features --features fedora,pgp,license --locked

      - name: Package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-x86_64-linux-fedora"
          cp target/release/omg "omg-v${VERSION}-x86_64-linux-fedora/"
          cp README.md LICENSE "omg-v${VERSION}-x86_64-linux-fedora/"
          tar -czvf "omg-v${VERSION}-x86_64-linux-fedora.tar.gz" "omg-v${VERSION}-x86_64-linux-fedora"
          sha256sum "omg-v${VERSION}-x86_64-linux-fedora.tar.gz" > "omg-v${VERSION}-x86_64-linux-fedora.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fedora-build
          path: omg-v*.tar.gz*

  build-macos:
    name: "Build macOS (ARM64)"
    needs: gate-on-ci
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Match rust-toolchain.toml (1.93.1) instead of floating "stable"
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.93.1"

      - name: Build
        run: cargo build --release --no-default-features --features macos,pgp,license --locked

      - name: Package
        run: |
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          mkdir -p "omg-v${VERSION}-aarch64-darwin"
          cp target/release/omg "omg-v${VERSION}-aarch64-darwin/"
          cp README.md LICENSE "omg-v${VERSION}-aarch64-darwin/"
          tar -czf "omg-v${VERSION}-aarch64-darwin.tar.gz" "omg-v${VERSION}-aarch64-darwin"
          shasum -a 256 "omg-v${VERSION}-aarch64-darwin.tar.gz" > "omg-v${VERSION}-aarch64-darwin.tar.gz.sha256"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-build
          path: omg-v*.tar.gz*

  # ════════════════════════════════════════════════════════════════════════════
  # PUBLISH RELEASE
  # ════════════════════════════════════════════════════════════════════════════

  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-arch, build-debian, build-ubuntu, build-fedora, build-macos]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Install SBOM metadata toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: "1.93.1"

      - name: Install SBOM generator
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate locked CycloneDX SBOM
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          fi
          test -n "$VERSION"
          cargo metadata --locked --format-version 1 > /dev/null
          cargo cyclonedx --format json --all-features --target all \
            --override-filename "omg-v${VERSION}.cdx"
          test -s "omg-v${VERSION}.cdx.json"
          git diff --exit-code -- Cargo.lock
          mkdir -p artifacts/release-metadata
          mv "omg-v${VERSION}.cdx.json" artifacts/release-metadata/

      - name: Upload release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-metadata
          path: artifacts/release-metadata/omg-v*.cdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Collect and verify exact release files
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          fi
          test -n "$VERSION"
          ./scripts/collect-release-artifacts.sh "$VERSION" artifacts release

      - name: Attest release archives and SBOM
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/*.tar.gz
            release/*.cdx.json

      - name: Generate Release Notes
        id: release_notes
        # Single source of truth for the notes structure lives in the script;
        # keep the generated verification section in sync with how artifacts
        # are actually attested and checked by install.sh / self-update.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          fi
          test -n "$VERSION"

          ./scripts/gen-release-notes.sh "${VERSION}" > release_notes.md

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Generated Release Notes Preview:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat release_notes.md
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release_notes.md
          files: release/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  # ════════════════════════════════════════════════════════════════════════════
  # SYNC TO CLOUDFLARE R2 (releases.pyro1121.com)
  # ════════════════════════════════════════════════════════════════════════════

  sync-r2:
    name: "Sync to Cloudflare R2"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    needs: [release]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          fi
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Collect and verify exact release files
        run: |
          ./scripts/collect-release-artifacts.sh "$VERSION" artifacts release

      - name: Install pinned wrangler from vendored lockfile
        run: npm ci --prefix .github/deps/release-tools

      - name: Upload release artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WRANGLER="$PWD/.github/deps/release-tools/node_modules/.bin/wrangler"
          "$WRANGLER" --version
          for artifact in release/omg-v*.tar.gz; do
            [ -f "$artifact" ] || continue
            basename=$(basename "$artifact")
            content_type="application/octet-stream"
            "$WRANGLER" r2 object put "omg-releases/$basename" \
              --file="$artifact" \
              --content-type="$content_type"
            echo "✓ Uploaded $basename"
          done

          for checksum in release/omg-v*.sha256; do
            [ -f "$checksum" ] || continue
            basename=$(basename "$checksum")
            "$WRANGLER" r2 object put "omg-releases/$basename" \
              --file="$checksum" \
              --content-type="text/plain"
            echo "✓ Uploaded $basename"
          done

      - name: Verify round-trip integrity of uploaded objects
        # Fail closed: if a single uploaded object cannot be re-downloaded
        # byte-identical, abort *before* the latest-version marker publishes
        # the release to clients.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WRANGLER="$PWD/.github/deps/release-tools/node_modules/.bin/wrangler"
          verify_dir="$(mktemp -d)"

          for artifact in release/omg-v*.tar.gz; do
            [ -f "$artifact" ] || continue
            basename=$(basename "$artifact")
            "$WRANGLER" r2 object get "omg-releases/$basename" \
              --file="$verify_dir/$basename" >/dev/null
            expected=$(sha256sum "$artifact" | awk '{print $1}')
            actual=$(sha256sum "$verify_dir/$basename" | awk '{print $1}')
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Round-trip verification failed for $basename"
              exit 1
            fi
            echo "✓ Round-trip verified: $basename"
          done

          for checksum in release/omg-v*.sha256; do
            [ -f "$checksum" ] || continue
            basename=$(basename "$checksum")
            "$WRANGLER" r2 object get "omg-releases/$basename" \
              --file="$verify_dir/$basename" >/dev/null
            if ! cmp -s "$checksum" "$verify_dir/$basename"; then
              echo "::error::Round-trip verification failed for $basename"
              exit 1
            fi
            echo "✓ Round-trip verified: $basename"
          done

      # Publish this last: clients only learn about the new version after every
      # archive and checksum is present in R2 AND round-trip verified.
      - name: Upload latest-version marker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WRANGLER="$PWD/.github/deps/release-tools/node_modules/.bin/wrangler"
          echo -n "$VERSION" > release/latest-version
          "$WRANGLER" r2 object put "omg-releases/latest-version" \
            --file=release/latest-version \
            --content-type="text/plain"
          echo "✓ Updated latest-version → $VERSION"
