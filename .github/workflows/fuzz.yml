name: Scheduled Fuzzing

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fuzz:
    name: Bounded fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly-2026-08-20

      - name: Cache fuzz dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          prefix-key: fuzz
          cache-on-failure: true

      - name: Restore fuzz corpus
        # Persist the corpus between weekly campaigns so each run continues
        # from where the previous one stopped instead of re-discovering the
        # same shallow inputs. Keyed by run_id so every completed campaign
        # saves a fresh snapshot; restore-keys fall back to the newest corpus.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-fuzz@0.13.2

      - name: Resolve the reviewed fuzz lockfile
        run: cargo fetch --manifest-path fuzz/Cargo.toml --locked

      - name: Run bounded fuzz targets
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          for target in parse_config ipc_messages package_names; do
            cargo fuzz run "$target" -- \
              -max_total_time=180 \
              -print_final_stats=1
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore
