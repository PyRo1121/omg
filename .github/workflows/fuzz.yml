name: Scheduled Fuzzing

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fuzz:
    name: Bounded fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: nightly-2026-08-20

      - name: Cache fuzz dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
          prefix-key: fuzz
          cache-on-failure: true

      - name: Restore fuzz corpus
        # Persist the corpus between weekly campaigns so each run continues
        # from where the previous one stopped instead of re-discovering the
        # same shallow inputs. Keyed by run_id so every completed campaign
        # saves a fresh snapshot; restore-keys fall back to the newest corpus.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: Resolve the reviewed fuzz lockfile
        run: cargo fetch --manifest-path fuzz/Cargo.toml --locked

      - name: Run bounded fuzz targets
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          for target in parse_config ipc_messages package_names; do
            cargo fuzz run "$target" -- \
              -max_total_time=180 \
              -print_final_stats=1
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore
