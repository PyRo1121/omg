# World-Class CI Pipeline for OMG
# Optimized for speed, reliability, and comprehensive coverage
#
# Key Features:
# - Path filtering: Only runs when relevant files change
# - Quick gate: Fast checks run first, gate expensive builds
# - Matrix strategy: 6 platforms tested in parallel
# - cargo-nextest: 10-35% faster test execution
# - Artifact caching: Shared caches across jobs
# - Timeout protection: Prevents runaway jobs
# - Test reporting: nextest terminal output (JUnit profile removed as unused)

name: CI

on:
  push:
    branches: [main]
    paths:
      - "build.rs"
      - "install.sh"
      - "benchmark.sh"
      - "benchmark-hyperfine.sh"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "benches/**"
      - "fuzz/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/**"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  # Always report the required check on PRs. The job-level change filter
  # below skips platform builds for documentation/configuration-only changes.
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: "Skip cache restoration"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # Latest SHA wins on both PRs and main. Leaving this false queued #175
  # behind a doomed #172 run that still had the debian Clippy failure.
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_LTO: "off"
  CARGO_PROFILE_TEST_LTO: "off"

jobs:
  #############################################################################
  # STAGE 1: Quick Gate (< 2 min)
  # Fast checks that gate expensive platform builds
  #############################################################################
  quick-gate:
    name: "Quick Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should-build: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'benches/**'
              - 'fuzz/**'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - '.github/workflows/ci.yml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workflow helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check shell syntax
        run: bash -n install.sh benchmark.sh benchmark-hyperfine.sh scripts/*.sh

      - name: Check Bash and Zsh package completion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh
          set +e
          timeout -k 10s 30s zsh tests/shell_completion.zsh > /tmp/shell-completion.log 2>&1
          rc=$?
          set -e
          cat /tmp/shell-completion.log
          echo '--- child zsh startup log ---'
          cat /tmp/omg-zsh-child.log 2>/dev/null || true
          exit "$rc"

      - name: Check local CI targets
        run: make -n ci-local-quick ci-local-full

  portable:
    name: "Portable Rust"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.93.1"
          components: clippy

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v2-portable"
          shared-key: "portable"
          cache-on-failure: true

      - name: Compile check
        run: cargo check --all-targets --no-default-features --features pgp,license --locked

      - name: Clippy
        run: |
          cargo clippy --all-targets --no-default-features --features pgp,license \
            --locked -- -D warnings

      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Debian feature isolation clippy
        run: |
          cargo clippy --all-targets --no-default-features \
            --features debian-pure --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest

      - name: Run portable tests
        run: cargo nextest run --lib --no-default-features --features pgp,license --locked --profile ci

  #############################################################################
  # STAGE 2: Platform Matrix (Linux containers)
  # Parallel builds across Arch, Debian, Fedora
  #############################################################################
  linux-matrix:
    name: "Linux (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arch
            image: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
            features: arch,pgp,license
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git pkgconf openssl libarchive clang cmake curl jq
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

          - platform: debian
            image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
            features: debian,pgp,license
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: debian-trixie
            image: debian:trixie@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
            features: debian,pgp,license
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: fedora
            image: fedora:latest@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
            features: fedora,pgp,license
            setup: |
              dnf install -y --setopt=install_weak_deps=False \
                git clang cmake openssl-devel pkgconfig findutils curl procps-ng \
                rpm dnf sqlite yum-utils fedora-release
              rpm --initdb
              dnf makecache --refresh
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # sccache temporarily disabled due to service outage

      - name: Cache cargo registry
        if: inputs.skip-cache != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v1-${{ matrix.platform }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: v1-${{ matrix.platform }}-registry-

      - name: Cache target
        if: inputs.skip-cache != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-${{ matrix.platform }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v1-${{ matrix.platform }}-target-${{ hashFiles('**/Cargo.lock') }}-
            v1-${{ matrix.platform }}-target-

      - name: Build release
        run: cargo build --release --no-default-features --features ${{ matrix.features }} --locked

      - name: Platform clippy
        run: |
          cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} \
            --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Run unit tests
        run: |
          cargo nextest run --lib --no-default-features --features ${{ matrix.features }} \
            --locked --profile ci --no-fail-fast

      - name: Prepare sandbox regression executable
        if: matrix.platform == 'arch'
        shell: bash
        run: |
          set -euo pipefail
          binary=$(cargo test --lib --no-run --no-default-features --features arch,pgp,license \
            --locked --message-format=json | jq -r \
            'select(.reason == "compiler-artifact" and .target.name == "omg_lib" and .profile.test) | .executable // empty')
          test -n "$binary"
          install -Dm755 "$binary" target/sandbox-test/omg-lib-tests

      - name: Upload sandbox regression executable
        if: matrix.platform == 'arch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-sandbox-test
          path: target/sandbox-test/omg-lib-tests
          retention-days: 1
          if-no-files-found: error

      - name: Run platform-specific integration tests
        run: |
          if [[ "${{ matrix.platform }}" == "fedora" ]]; then
            cargo nextest run --test fedora_tests --no-default-features --features ${{ matrix.features }} \
              --locked --profile ci --no-fail-fast
          fi

      - name: Debian deterministic benchmark regression check
        if: matrix.platform == 'debian'
        env:
          OMG_BENCH_WRITE_JSON: "1"
          OMG_BENCH_JSON_OUT: target/bench/debian-matrix.json
          OMG_BENCH_BASELINE_JSON: benchmarks/baselines/debian-matrix-baseline.json
          OMG_BENCH_REGRESSION_MULTIPLIER: "2.0"
        run: |
          cargo test --test bench_debian --no-default-features --features ${{ matrix.features }} --locked \
            bench_debian_deterministic_matrix -- --nocapture

      - name: Upload Debian benchmark artifact
        if: matrix.platform == 'debian'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-debian-matrix
          path: target/bench/debian-matrix.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish Debian benchmark summary
        if: matrix.platform == 'debian'
        run: |
          echo "## Debian Deterministic Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat target/bench/debian-matrix.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify binary
        run: |
          ./target/release/omg --version
          ./target/release/omg --help | head -20

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-${{ matrix.platform }}
          path: target/release/omg
          retention-days: 7
          if-no-files-found: error

  sandbox-cancellation:
    name: "AUR sandbox cancellation"
    needs: [quick-gate, linux-matrix]
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-sandbox-test
          path: fixture

      - name: Prepare sandbox runtime image
        run: |
          docker build --tag omg-sandbox-regression - <<'DOCKERFILE'
          FROM archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
          RUN pacman -Syu --noconfirm --needed bubblewrap && pacman -Scc --noconfirm
          DOCKERFILE

      - name: Prepare sandbox seccomp profile
        run: |
          curl -fsS https://raw.githubusercontent.com/moby/profiles/61eaf32614c7c71b60bd8927d3e6a4ffc8ff1f31/seccomp/default.json -o seccomp-default.json
          echo '536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  seccomp-default.json' | sha256sum --check
          jq '(.syscalls[] | select(.includes.caps == ["CAP_SYS_ADMIN"]) | .names) += ["pivot_root"]' \
            seccomp-default.json > seccomp-sandbox.json

      - name: Verify descendant cleanup
        timeout-minutes: 2
        run: |
          chmod +x fixture/omg-lib-tests
          # Only this fixture gets namespace permissions, not compilation or
          # other tests. No checkout, credentials, or Docker socket are mounted.
          # Bubblewrap also needs pivot_root, which the default profile denies.
          docker run --rm --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --security-opt "seccomp=$PWD/seccomp-sandbox.json" \
            --pids-limit 128 --memory 1g --cpus 2 \
            --mount "type=bind,source=$PWD/fixture,target=/fixture,readonly" \
            omg-sandbox-regression /bin/bash -euo pipefail -c '
              test_name=package_managers::aur::client::tests::cancelling_logged_sandbox_build_terminates_descendants
              /fixture/omg-lib-tests --ignored --list | grep -Fx "$test_name: test"
              /fixture/omg-lib-tests --exact "$test_name" --ignored --nocapture
            '

  #############################################################################
  # STAGE 2a: Feature-intersection compile checks
  #
  # The per-platform legs above each enable exactly ONE backend feature, so
  # code paths that only exist under backend INTERSECTIONS are never
  # type-checked anywhere (Wave-3 review F2). These two legs close the gap:
  #   - arch+pgp+license: pgp was previously only ever compiled backend-free
  #     (quick gate), so nothing exercised sequoia together with backend code.
  #   - debian+pgp: exercises the rust-apt FFI stack against a different
  #     optional-dependency combination.
  # Compile/clippy only — no tests, no release build — to keep wall time near
  # the per-leg quick-gate budget.
  #############################################################################
  feature-intersections:
    name: "Intersections (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arch-pgp-license
            image: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
            features: arch,pgp,license
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git pkgconf openssl libarchive clang cmake curl
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: debian-pgp
            image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
            features: debian,pgp
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config sudo \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v1-xsec-${{ matrix.platform }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: v1-xsec-${{ matrix.platform }}-registry-

      - name: Cache target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v1-xsec-${{ matrix.platform }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v1-xsec-${{ matrix.platform }}-target-

      - name: Check all targets
        run: cargo check --all-targets --no-default-features --features ${{ matrix.features }} --locked

      # Clippy on the arch intersection leg; the debian leg is check-only by
      # design (see job comment) to bound total CI time.
      - name: Clippy
        if: matrix.features == 'arch,pgp,license'
        run: |
          cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} \
            --locked -- -D warnings

  #############################################################################
  # STAGE 2b: Native Platform Build (macOS)
  #############################################################################
  macos:
    name: "macOS (ARM64)"
    needs: quick-gate
    # `!github.event.act` skips this leg during local act runs (no macOS
    # containers exist); the condition is always true on GitHub.
    if: (needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && !github.event.act
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # Pin to rust-toolchain.toml's channel so the macOS leg uses the exact
        # same toolchain as every other CI leg (the action otherwise installs
        # the latest "stable").
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.93.1"

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-macos-arm64"

      # sccache temporarily disabled due to service outage

      - name: Build
        run: cargo build --release --no-default-features --features macos,pgp,license --locked

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Run unit tests
        run: cargo nextest run --lib --no-default-features --features macos,pgp,license --locked --profile ci

      - name: Install Homebrew test packages
        run: |
          brew list wget &>/dev/null || brew install wget

      - name: Run macOS platform integration tests
        run: |
          cargo test --test macos_tests --no-default-features --features macos,pgp,license --locked -- --test-threads=1

      - name: Verify binary
        run: |
          ./target/release/omg --version
          file ./target/release/omg

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-macos-arm64
          path: target/release/omg
          retention-days: 7

  #############################################################################
  # STAGE 2c: Ubuntu (matches the Ubuntu release artifact)
  #############################################################################
  ubuntu:
    name: "Linux (ubuntu)"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libapt-pkg-dev \
            pkg-config \
            libssl-dev \
            clang \
            cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.93.1"
          components: clippy

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-ubuntu-debian"

      - name: Build release
        run: cargo build --release --no-default-features --features debian,pgp,license --locked

      - name: Platform clippy
        run: |
          cargo clippy --all-targets --no-default-features --features debian,pgp,license \
            --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Run unit tests
        run: cargo nextest run --lib --no-default-features --features debian,pgp,license --locked --profile ci

      - name: Verify binary
        run: |
          ./target/release/omg --version
          ./target/release/omg --help | head -20

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omg-ubuntu
          path: target/release/omg
          retention-days: 7
          if-no-files-found: error

  #############################################################################
  # STAGE 4: Final Status Gate
  #############################################################################
  # NOTE: no `integration` job exists in this workflow; it was referenced here
  # but never defined, which made ci-success unresolvable on GitHub and broke
  # the entire pipeline gate. Local act runs also skip the macos leg, so a
  # skipped macos result is accepted as passing. A skipped platform job must
  # not mint a release tag.
  ci-success:
    name: "CI Success"
    needs: [quick-gate, portable, linux-matrix, sandbox-cancellation, feature-intersections, macos, ubuntu]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Evaluate results
        env:
          QUICK_GATE: ${{ needs.quick-gate.result }}
          PORTABLE: ${{ needs.portable.result }}
          LINUX_MATRIX: ${{ needs.linux-matrix.result }}
          SANDBOX_CANCELLATION: ${{ needs.sandbox-cancellation.result }}
          FEATURE_INTERSECTIONS: ${{ needs.feature-intersections.result }}
          MACOS: ${{ needs.macos.result }}
          UBUNTU: ${{ needs.ubuntu.result }}
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Gate | $QUICK_GATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Portable Rust | $PORTABLE |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Matrix | $LINUX_MATRIX |" >> $GITHUB_STEP_SUMMARY
          echo "| AUR Sandbox Cancellation | $SANDBOX_CANCELLATION |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Intersections | $FEATURE_INTERSECTIONS |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | $MACOS |" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu | $UBUNTU |" >> $GITHUB_STEP_SUMMARY

          if [[ "$QUICK_GATE" != "success" ]]; then
            echo "::error::Quick gate failed"
            exit 1
          fi

          declare -A required_results=(
            ["Portable Rust"]="$PORTABLE"
            ["Linux Matrix"]="$LINUX_MATRIX"
            ["AUR Sandbox Cancellation"]="$SANDBOX_CANCELLATION"
            ["Feature Intersections"]="$FEATURE_INTERSECTIONS"
            ["macOS"]="$MACOS"
            ["Ubuntu"]="$UBUNTU"
          )
          for job in "${!required_results[@]}"; do
            if [[ "${required_results[$job]}" != "success" && "${required_results[$job]}" != "skipped" ]]; then
              echo "::error::$job did not succeed: ${required_results[$job]}"
              exit 1
            fi
          done

          if [[ "$LINUX_MATRIX" == "success" && "$SANDBOX_CANCELLATION" != "success" ]]; then
            echo "::error::Arch builds completed without the required sandbox regression"
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required checks passed!" >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Tag Cargo.toml version when all platform builds succeeded
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_MATRIX: ${{ needs.linux-matrix.result }}
          SANDBOX_CANCELLATION: ${{ needs.sandbox-cancellation.result }}
          FEATURE_INTERSECTIONS: ${{ needs.feature-intersections.result }}
          MACOS: ${{ needs.macos.result }}
          UBUNTU: ${{ needs.ubuntu.result }}
        run: |
          if [[ "$LINUX_MATRIX" != "success" \
             || "$SANDBOX_CANCELLATION" != "success" \
             || "$FEATURE_INTERSECTIONS" != "success" \
             || "$MACOS" != "success" \
             || "$UBUNTU" != "success" ]]; then
            echo "Platform jobs were skipped or incomplete; not tagging a release"
            exit 0
          fi

          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          test -n "$VERSION"
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag $TAG already exists; bump Cargo.toml to cut a new alpha"
            exit 0
          fi

          scripts/require-workflow-success.sh benchmark.yml "$GITHUB_SHA" Benchmark

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Pushed $TAG but origin does not have refs/tags/${TAG}"
            exit 1
          fi
          echo "Tagged $TAG at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged $TAG at $GITHUB_SHA"

          # GITHUB_TOKEN tag pushes do not start other workflows. Dispatch
          # Release explicitly so GitHub Latest is not left on a 7-month-old tag.
          gh workflow run release.yml --ref "$TAG" -f dry_run=false
          echo "Dispatched Release for $TAG"
