# World-Class CI Pipeline for OMG
# Optimized for speed, reliability, and comprehensive coverage
#
# Key Features:
# - Path filtering: Only runs when relevant files change
# - Quick gate: Fast checks run first, gate expensive builds
# - Matrix strategy: 6 platforms tested in parallel
# - cargo-nextest: 10-35% faster test execution
# - Artifact caching: Shared caches across jobs
# - Timeout protection: Prevents runaway jobs
# - Test reporting: nextest terminal output (JUnit profile removed as unused)

name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "benches/**"
      - "fuzz/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/**"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "benches/**"
      - "fuzz/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/**"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: "Skip cache restoration"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_LTO: "off"
  CARGO_PROFILE_TEST_LTO: "off"

jobs:
  #############################################################################
  # STAGE 1: Quick Gate (< 2 min)
  # Fast checks that gate expensive platform builds
  #############################################################################
  quick-gate:
    name: "Quick Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should-build: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: changes
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'Makefile'
              - 'benches/**'
              - 'fuzz/**'
              - 'scripts/**'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - 'deny.toml'
              - '.github/workflows/**'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v2-quick"
          shared-key: "quick-gate"
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (portable)
        run: |
          cargo clippy --all-targets --no-default-features --features pgp,license \
            --locked -- -D warnings

      - name: Compile check
        run: cargo check --all-targets --no-default-features --features pgp,license --locked

      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Install nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Debian feature isolation check
        run: |
          cargo check --all-targets --no-default-features \
            --features debian-pure --locked

      - name: Run portable tests
        run: cargo nextest run --lib --no-default-features --features pgp,license --locked --profile ci

  #############################################################################
  # STAGE 2: Platform Matrix (Linux containers)
  # Parallel builds across Arch, Debian, Fedora
  #############################################################################
  linux-matrix:
    name: "Linux (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arch
            image: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
            features: arch,pgp,license
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git pkgconf openssl libarchive clang cmake curl
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

          - platform: debian
            image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
            features: debian,pgp,license
            experimental: false
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: debian-trixie
            image: debian:trixie@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
            features: debian,pgp,license
            experimental: true
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: fedora
            image: fedora:latest@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
            features: fedora,pgp,license
            setup: |
              dnf install -y --setopt=install_weak_deps=False \
                git clang cmake openssl-devel pkgconfig findutils curl \
                rpm dnf sqlite yum-utils fedora-release
              rpm --initdb
              dnf makecache --refresh
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # sccache temporarily disabled due to service outage

      - name: Cache cargo registry
        if: inputs.skip-cache != true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v1-${{ matrix.platform }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: v1-${{ matrix.platform }}-registry-

      - name: Cache target
        if: inputs.skip-cache != true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: v1-${{ matrix.platform }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v1-${{ matrix.platform }}-target-${{ hashFiles('**/Cargo.lock') }}-
            v1-${{ matrix.platform }}-target-

      - name: Build release
        run: cargo build --release --no-default-features --features ${{ matrix.features }} --locked

      - name: Platform clippy
        run: |
          cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} \
            --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Run unit tests
        run: |
          cargo nextest run --lib --no-default-features --features ${{ matrix.features }} \
            --locked --profile ci --no-fail-fast

      - name: Run platform-specific integration tests
        run: |
          if [[ "${{ matrix.platform }}" == "fedora" ]]; then
            cargo nextest run --test fedora_tests --no-default-features --features ${{ matrix.features }} \
              --locked --profile ci --no-fail-fast
          fi

      - name: Debian deterministic benchmark regression check
        if: matrix.platform == 'debian'
        env:
          OMG_BENCH_WRITE_JSON: "1"
          OMG_BENCH_JSON_OUT: target/bench/debian-matrix.json
          OMG_BENCH_BASELINE_JSON: benchmarks/baselines/debian-matrix-baseline.json
          OMG_BENCH_REGRESSION_MULTIPLIER: "2.0"
        run: |
          cargo test --test bench_debian --no-default-features --features ${{ matrix.features }} --locked \
            bench_debian_deterministic_matrix -- --nocapture

      - name: Upload Debian benchmark artifact
        if: matrix.platform == 'debian'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bench-debian-matrix
          path: target/bench/debian-matrix.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish Debian benchmark summary
        if: matrix.platform == 'debian'
        run: |
          echo "## Debian Deterministic Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat target/bench/debian-matrix.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify binary
        run: |
          ./target/release/omg --version
          ./target/release/omg --help | head -20

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omg-${{ matrix.platform }}
          path: target/release/omg
          retention-days: 7
          if-no-files-found: error

  #############################################################################
  # STAGE 2a: Feature-intersection compile checks
  #
  # The per-platform legs above each enable exactly ONE backend feature, so
  # code paths that only exist under backend INTERSECTIONS are never
  # type-checked anywhere (Wave-3 review F2). These two legs close the gap:
  #   - arch+pgp+license: pgp was previously only ever compiled backend-free
  #     (quick gate), so nothing exercised sequoia together with backend code.
  #   - debian+pgp: exercises the rust-apt FFI stack against a different
  #     optional-dependency combination.
  # Compile/clippy only — no tests, no release build — to keep wall time near
  # the per-leg quick-gate budget.
  #############################################################################
  feature-intersections:
    name: "Intersections (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arch-pgp-license
            image: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
            features: arch,pgp,license
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git pkgconf openssl libarchive clang cmake curl
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: debian-pgp
            image: debian:bookworm@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
            features: debian,pgp
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -fsSL \
                https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
                -o /tmp/rustup-init
              echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" | sha256sum --check
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --profile minimal --default-toolchain 1.93.1
              rm -f /tmp/rustup-init
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v1-xsec-${{ matrix.platform }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: v1-xsec-${{ matrix.platform }}-registry-

      - name: Cache target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: v1-xsec-${{ matrix.platform }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v1-xsec-${{ matrix.platform }}-target-

      - name: Check all targets
        run: cargo check --all-targets --no-default-features --features ${{ matrix.features }} --locked

      # Clippy on the arch intersection leg; the debian leg is check-only by
      # design (see job comment) to bound total CI time.
      - name: Clippy
        if: matrix.features == 'arch,pgp,license'
        run: |
          cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} \
            --locked -- -D warnings

  #############################################################################
  # STAGE 2b: Native Platform Build (macOS)
  #############################################################################
  macos:
    name: "macOS (ARM64)"
    needs: quick-gate
    # `!github.event.act` skips this leg during local act runs (no macOS
    # containers exist); the condition is always true on GitHub.
    if: (needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && !github.event.act
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        # Pin to rust-toolchain.toml's channel so the macOS leg uses the exact
        # same toolchain as every other CI leg (the action otherwise installs
        # the latest "stable").
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.93.1"

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-macos-arm64"

      # sccache temporarily disabled due to service outage

      - name: Build
        run: cargo build --release --no-default-features --features macos,pgp,license --locked

      - name: Install nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: nextest
      - name: Verify nextest
        run: cargo nextest --version

      - name: Run unit tests
        run: cargo nextest run --lib --no-default-features --features macos,pgp,license --locked --profile ci

      - name: Install Homebrew test packages
        run: |
          brew list wget &>/dev/null || brew install wget

      - name: Run macOS platform integration tests
        run: |
          cargo test --test macos_tests --no-default-features --features macos,pgp,license --locked -- --test-threads=1

      - name: Verify binary
        run: |
          ./target/release/omg --version
          file ./target/release/omg

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omg-macos-arm64
          path: target/release/omg
          retention-days: 7

  #############################################################################
  #############################################################################
  # STAGE 4: Final Status Gate
  #############################################################################
  # NOTE: no `integration` job exists in this workflow; it was referenced here
  # but never defined, which made ci-success unresolvable on GitHub and broke
  # the entire pipeline gate. Local act runs also skip the macos leg, so a
  # skipped macos result is accepted as passing.
  ci-success:
    name: "CI Success"
    needs: [quick-gate, linux-matrix, feature-intersections, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          QUICK_GATE: ${{ needs.quick-gate.result }}
          LINUX_MATRIX: ${{ needs.linux-matrix.result }}
          FEATURE_INTERSECTIONS: ${{ needs.feature-intersections.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Gate | $QUICK_GATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Matrix | $LINUX_MATRIX |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Intersections | $FEATURE_INTERSECTIONS |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | $MACOS |" >> $GITHUB_STEP_SUMMARY

          if [[ "$QUICK_GATE" != "success" ]]; then
            echo "::error::Quick gate failed"
            exit 1
          fi

          declare -A required_results=(
            ["Linux Matrix"]="$LINUX_MATRIX"
            ["Feature Intersections"]="$FEATURE_INTERSECTIONS"
            ["macOS"]="$MACOS"
          )
          for job in "${!required_results[@]}"; do
            if [[ "${required_results[$job]}" != "success" && "${required_results[$job]}" != "skipped" ]]; then
              echo "::error::$job did not succeed: ${required_results[$job]}"
              exit 1
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required checks passed!" >> $GITHUB_STEP_SUMMARY
