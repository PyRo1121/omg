# World-Class CI Pipeline for OMG
# Optimized for speed, reliability, and comprehensive coverage
#
# Key Features:
# - Path filtering: Only runs when relevant files change
# - Quick gate: Fast checks run first, gate expensive builds
# - Matrix strategy: 6 platforms tested in parallel
# - cargo-nextest: 10-35% faster test execution
# - Artifact caching: Shared caches across jobs
# - Timeout protection: Prevents runaway jobs
# - Test reporting: JUnit XML for GitHub integration

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'benches/**'
      - 'fuzz/**'
      - 'scripts/**'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.config/**'
      - 'deny.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'benches/**'
      - 'fuzz/**'
      - 'scripts/**'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.config/**'
      - 'deny.toml'
      - '.github/workflows/ci.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Skip cache restoration'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_LTO: "off"
  CARGO_PROFILE_TEST_LTO: "off"

jobs:
  #############################################################################
  # STAGE 1: Quick Gate (< 2 min)
  # Fast checks that gate expensive platform builds
  #############################################################################
  quick-gate:
    name: "Quick Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should-build: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: changes
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'Makefile'
              - 'benches/**'
              - 'fuzz/**'
              - 'scripts/**'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - 'deny.toml'
              - '.github/workflows/**'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-quick"
          shared-key: "quick-gate"
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (portable)
        run: |
          cargo clippy --all-targets --no-default-features --features pgp,license \
            --locked -- -D warnings -D clippy::pedantic -A clippy::module_name_repetitions

      - name: Compile check
        run: cargo check --all-targets --no-default-features --features pgp,license --locked

      - name: Install nextest
        uses: taiki-e/install-action@68250fb3d551d72befef105162372ebb3e8016e0 # nextest

      - name: Debian feature isolation check
        run: |
          cargo check --all-targets --no-default-features \
            --features debian-pure,debian-deb822-backend,debian-resolvo --locked

      - name: Run portable tests
        run: cargo nextest run --lib --no-default-features --features pgp,license --locked --profile ci

  #############################################################################
  # STAGE 2: Platform Matrix (Linux containers)
  # Parallel builds across Arch, Debian, Fedora
  #############################################################################
  linux-matrix:
    name: "Linux (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arch
            image: archlinux:latest
            features: arch,license
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git pkgconf openssl libarchive clang cmake curl
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

          - platform: debian
            image: debian:bookworm
            features: debian
            experimental: false
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: debian-trixie
            image: debian:trixie
            features: debian
            experimental: true
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy

          - platform: fedora
            image: fedora:latest
            features: fedora,license
            setup: |
              dnf install -y --setopt=install_weak_deps=False \
                git clang cmake openssl-devel pkgconfig findutils curl \
                rpm dnf sqlite yum-utils fedora-release
              rpm --initdb
              dnf makecache --refresh
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              "$HOME/.cargo/bin/rustup" component add clippy rustfmt

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Setup environment
        run: ${{ matrix.setup }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # sccache temporarily disabled due to service outage

      - name: Cache cargo registry
        if: inputs.skip-cache != true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v1-${{ matrix.platform }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: v1-${{ matrix.platform }}-registry-

      - name: Cache target
        if: inputs.skip-cache != true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: v1-${{ matrix.platform }}-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs') }}
          restore-keys: |
            v1-${{ matrix.platform }}-target-${{ hashFiles('**/Cargo.lock') }}-
            v1-${{ matrix.platform }}-target-

      - name: Build release
        run: cargo build --release --no-default-features --features ${{ matrix.features }} --locked

      - name: Platform clippy
        run: |
          cargo clippy --all-targets --no-default-features --features ${{ matrix.features }} \
            --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@68250fb3d551d72befef105162372ebb3e8016e0 # nextest

      - name: Run unit tests
        run: |
          cargo nextest run --lib --no-default-features --features ${{ matrix.features }} \
            --locked --profile ci --no-fail-fast

      - name: Run platform-specific integration tests
        run: |
          if [[ "${{ matrix.platform }}" == "fedora" ]]; then
            cargo nextest run --test fedora_tests --no-default-features --features ${{ matrix.features }} \
              --locked --profile ci --no-fail-fast
          fi

      - name: Debian deterministic benchmark regression check
        if: matrix.platform == 'debian'
        env:
          OMG_BENCH_WRITE_JSON: "1"
          OMG_BENCH_JSON_OUT: target/bench/debian-matrix.json
          OMG_BENCH_BASELINE_JSON: benchmarks/baselines/debian-matrix-baseline.json
          OMG_BENCH_REGRESSION_MULTIPLIER: "2.0"
        run: |
          cargo test --test bench_debian --no-default-features --features ${{ matrix.features }} --locked \
            bench_debian_deterministic_matrix -- --nocapture

      - name: Upload Debian benchmark artifact
        if: matrix.platform == 'debian'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bench-debian-matrix
          path: target/bench/debian-matrix.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish Debian benchmark summary
        if: matrix.platform == 'debian'
        run: |
          echo "## Debian Deterministic Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat target/bench/debian-matrix.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify binary
        run: |
          ./target/release/omg --version
          ./target/release/omg --help | head -20

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omg-${{ matrix.platform }}
          path: target/release/omg
          retention-days: 7
          if-no-files-found: error


  #############################################################################
  # STAGE 2b: Native Platform Builds (macOS, Windows)
  #############################################################################
  macos:
    name: "macOS (ARM64)"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-macos-arm64"

      # sccache temporarily disabled due to service outage

      - name: Build
        run: cargo build --release --no-default-features --features macos,license --locked

      - name: Install nextest
        uses: taiki-e/install-action@68250fb3d551d72befef105162372ebb3e8016e0 # nextest

      - name: Run unit tests
        run: cargo nextest run --lib --no-default-features --features macos,license --locked --profile ci

      - name: Install Homebrew test packages
        run: |
          brew list wget &>/dev/null || brew install wget

      - name: Run macOS platform integration tests
        run: |
          cargo test --test macos_tests --no-default-features --features macos,license --locked -- --test-threads=1

      - name: Verify binary
        run: |
          ./target/release/omg --version
          file ./target/release/omg

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omg-macos-arm64
          path: target/release/omg
          retention-days: 7

  windows:
    name: "Windows (x64)"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup cache
        if: inputs.skip-cache != true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v1-windows"

      # sccache temporarily disabled due to service outage

      - name: Build
        run: cargo build --release --no-default-features --features windows,license --locked

      - name: Install nextest
        uses: taiki-e/install-action@68250fb3d551d72befef105162372ebb3e8016e0 # nextest

      - name: Run unit tests
        run: cargo nextest run --lib --no-default-features --features windows,license --locked --profile ci

      - name: Install Scoop
        shell: pwsh
        run: |
          if (!(Get-Command scoop -ErrorAction SilentlyContinue)) {
            irm get.scoop.sh -outfile 'install.ps1'
            .\install.ps1 -RunAsAdmin
          }

      - name: Run Windows platform integration tests
        shell: pwsh
        run: |
          cargo test --test windows_tests --no-default-features --features windows,license --locked -- --test-threads=1

      - name: Verify binary
        run: |
          .\target\release\omg.exe --version
          .\target\release\omg.exe --help | Select-Object -First 20

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omg-windows-x64
          path: target/release/omg.exe
          retention-days: 7

  #############################################################################
  # STAGE 2c: Code Coverage Per Platform
  #############################################################################
  coverage:
    name: "Coverage (${{ matrix.platform }})"
    needs: quick-gate
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arch
            os: ubuntu-latest
            container: archlinux:latest
            features: arch,license
            setup: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git pkgconf openssl libarchive clang cmake curl
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0 --component llvm-tools-preview
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            test_args: "--lib --test arch_tests --test cross_platform_mock_tests"

          - platform: debian
            os: ubuntu-latest
            container: debian:bookworm
            features: debian,license
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config \
                libssl-dev libapt-pkg-dev clang cmake zlib1g-dev liblzma-dev libbz2-dev
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0 --component llvm-tools-preview
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            test_args: "--lib --test debian_tests --test cross_platform_mock_tests"

          - platform: fedora
            os: ubuntu-latest
            container: fedora:latest
            features: fedora,license
            setup: |
              dnf install -y --setopt=install_weak_deps=False \
                git clang cmake openssl-devel pkgconfig findutils curl \
                rpm dnf sqlite yum-utils fedora-release
              rpm --initdb
              dnf makecache --refresh
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0 --component llvm-tools-preview
              echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            test_args: "--lib --test fedora_tests --test cross_platform_mock_tests"
            
          - platform: macos
            os: macos-14
            features: macos,license
            setup: |
              rustup component add llvm-tools-preview
              brew list wget &>/dev/null || brew install wget
            test_args: "--lib --test macos_tests --test cross_platform_mock_tests"
            
          - platform: windows
            os: windows-latest
            features: windows,license
            setup: |
              rustup component add llvm-tools-preview
            test_args: "--lib --test windows_tests --test cross_platform_mock_tests"
            
    container: ${{ matrix.container }}
    
    steps:
      - name: Setup environment
        if: matrix.container != null
        run: ${{ matrix.setup }}
        
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Fix git permissions
        if: matrix.container != null
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        
      - name: Install Rust (native platforms)
        if: matrix.container == null
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
          
      - name: Setup environment (native)
        if: matrix.container == null
        run: ${{ matrix.setup }}
        
      - name: Install Scoop (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (!(Get-Command scoop -ErrorAction SilentlyContinue)) {
            irm get.scoop.sh -outfile 'install.ps1'
            .\install.ps1 -RunAsAdmin
          }
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3ee274a48739f9c49921feda61cb199dc7520e62 # cargo-llvm-cov
        
      - name: Cache cargo registry
        if: inputs.skip-cache != true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: v1-${{ matrix.platform }}-coverage-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: v1-${{ matrix.platform }}-coverage-registry-
          
      - name: Generate coverage
        run: |
          cargo llvm-cov --no-report --no-default-features --features ${{ matrix.features }} ${{ matrix.test_args }} --locked
          
      - name: Generate coverage report
        run: |
          cargo llvm-cov report --lcov --output-path lcov-${{ matrix.platform }}.info
          
      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.platform }}
          path: lcov-${{ matrix.platform }}.info
          retention-days: 1
          
  #############################################################################
  # STAGE 2d: Aggregate Coverage Reports
  #############################################################################
  coverage-aggregate:
    name: "Aggregate Coverage"
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Download all coverage reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-*
          path: coverage-reports
          
      - name: Merge coverage reports
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          
          # Find all lcov files
          find coverage-reports -name "*.info" -type f
          
          # Merge all coverage files
          lcov --rc lcov_branch_coverage=1 \
            $(find coverage-reports -name "*.info" -type f | sed 's/^/--add-tracefile /') \
            --output-file merged-coverage.info
            
          # Generate summary
          lcov --list merged-coverage.info > coverage-summary.txt
          
      - name: Generate coverage summary for PR
        run: |
          echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -50 coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Extract overall coverage percentage
          COVERAGE=$(lcov --summary merged-coverage.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
          
      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: merged-coverage.info
          flags: unittests,integration
          name: platform-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          
      - name: Upload merged coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-merged
          path: |
            merged-coverage.info
            coverage-summary.txt
          retention-days: 30

  #############################################################################
  # STAGE 3: Integration Tests (only on main platform)
  #############################################################################
  integration:
    name: "Integration Tests"
    needs: [quick-gate, linux-matrix]
    if: needs.quick-gate.outputs.should-build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Setup
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git rust cargo clang cmake

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: v1-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: v1-integration-

      - name: Install nextest
        uses: taiki-e/install-action@68250fb3d551d72befef105162372ebb3e8016e0 # nextest

      - name: Run integration tests
        env:
          OMG_TEST_COMMAND_TIMEOUT_SECS: "10"
        run: |
          cargo nextest run --test '*' --features arch,license --locked --profile ci --no-fail-fast \
            2>&1

      - name: Run Arch AUR canary tests (blocking)
        env:
          OMG_RUN_SYSTEM_TESTS: "1"
          OMG_TEST_COMMAND_TIMEOUT_SECS: "20"
        run: |
          cargo test --test aur_error_recovery --features arch,license --locked \
            test_error_git_pull_failure_recovers_by_reclone -- --exact --nocapture
          cargo test --test aur_error_recovery --features arch,license --locked \
            test_canary_ladybird_git_dry_run_detects_aur_source -- --exact --nocapture

  #############################################################################
  # STAGE 4: Final Status Gate
  #############################################################################
  ci-success:
    name: "CI Success"
    needs: [quick-gate, linux-matrix, macos, windows, coverage-aggregate, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          QUICK_GATE: ${{ needs.quick-gate.result }}
          LINUX_MATRIX: ${{ needs.linux-matrix.result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          COVERAGE: ${{ needs.coverage-aggregate.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Gate | $QUICK_GATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Matrix | $LINUX_MATRIX |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | $MACOS |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | $WINDOWS |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | $INTEGRATION |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | $COVERAGE |" >> $GITHUB_STEP_SUMMARY

          if [[ "$QUICK_GATE" != "success" ]]; then
            echo "::error::Quick gate failed"
            exit 1
          fi

          declare -A required_results=(
            ["Linux Matrix"]="$LINUX_MATRIX"
            ["macOS"]="$MACOS"
            ["Windows"]="$WINDOWS"
            ["Integration"]="$INTEGRATION"
            ["Coverage"]="$COVERAGE"
          )
          for job in "${!required_results[@]}"; do
            if [[ "${required_results[$job]}" != "success" ]]; then
              echo "::error::$job did not succeed: ${required_results[$job]}"
              exit 1
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required checks passed!" >> $GITHUB_STEP_SUMMARY
