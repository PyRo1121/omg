name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: "Vulnerability Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.93.0"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "audit"
          cache-on-failure: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@fc79696c54ba9f873726bafbf4e45601329839fd # cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@be8e48a54f508d12604e2a74fda853e27889c2dc # cargo-deny

      - name: Run cargo-audit (Vulnerability Scan)
        run: cargo audit

      - name: Run cargo-deny (Supply Chain Security)
        run: |
          echo "## 🔒 Supply Chain Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check advisories
          echo "### Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          cargo deny check advisories 2>&1 | tee -a $GITHUB_STEP_SUMMARY

          # Check licenses
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### License Compliance" >> $GITHUB_STEP_SUMMARY
          cargo deny check licenses 2>&1 | tee -a $GITHUB_STEP_SUMMARY

          # Check bans (duplicate dependencies)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Bans & Duplicates" >> $GITHUB_STEP_SUMMARY
          cargo deny check bans 2>&1 | tee -a $GITHUB_STEP_SUMMARY

          # Check sources
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Source Verification" >> $GITHUB_STEP_SUMMARY
          cargo deny check sources 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Generate dependency tree
        if: always()
        run: cargo tree --depth 3 > dependency-tree.txt

      - name: Upload dependency tree
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-tree
          path: dependency-tree.txt
          retention-days: 30
